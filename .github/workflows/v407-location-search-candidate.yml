name: Build V4.07 location search test candidate

on:
  push:
    branches:
      - feature/v4.07-location-search-ui
      - feature/v4.07-location-search-ui-next
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v407-location-search-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prove canonical V4.06 frontend is still valid
        run: node scripts/verify-frontend.mjs
      - name: Check V4.07 stabilization scripts syntax
        run: |
          node --check scripts/v4-07-location-search-delta.mjs
          node --check scripts/v4-07-help-notes-delta.mjs
          node --check scripts/v4-07-saved-places-delta.mjs
          node --check scripts/v4-07-country-groups-delta.mjs
          node --check scripts/v4-07-network-security-delta.mjs
          node --check scripts/v4-07-todo-setup-help-delta.mjs
          node --check scripts/v4-07-saved-places-soft-delete-delta.mjs
          node --check scripts/v4-07-ui-regression-polish-delta.mjs
          node --check scripts/v4-07-location-dropdown-viewport-delta.mjs
          node --check scripts/v4-07-location-dropdown-dismiss-delta.mjs
          node --check scripts/v4-07-help-release-history-i18n-delta.mjs
          node --check scripts/v4-07-full-i18n-delta.mjs
          node --check scripts/v4-07-firewall-icon-delta.mjs
          node --check scripts/v4-07-firewall-icon-variant2-delta.mjs
          node --check scripts/v4-07-location-query-clear-delta.mjs
          node --check scripts/v4-07-desktop-query-clear-version-delta.mjs
          node --check scripts/build-v407-location-search-candidate.mjs
          node --check scripts/finalize-v407-test8-candidate.mjs
          node --check scripts/finalize-v407-test9-candidate.mjs
          node --check scripts/finalize-v407-test10-candidate.mjs
          node --check scripts/finalize-v407-test10r1-candidate.mjs
          node --check scripts/test-v407-test8-candidate.mjs
          node --check scripts/test-v407-test9-candidate.mjs
          node --check scripts/test-v407-full-i18n-candidate.mjs
          node --check scripts/test-v407-test10-candidate.mjs
          node --check scripts/test-v407-test10r1-candidate.mjs
      - name: Build accepted TEST7 base
        run: node scripts/build-v407-location-search-candidate.mjs
      - name: Check TEST7 generated JavaScript syntax
        run: node --check artifacts/v407/gewitterradar.js
      - name: Finalize TEST8 selected firewall icon
        run: node scripts/finalize-v407-test8-candidate.mjs
      - name: Check TEST8 generated JavaScript syntax
        run: node --check artifacts/v407/gewitterradar.js
      - name: Validate TEST8 firewall icon contract
        run: node scripts/test-v407-test8-candidate.mjs
      - name: Prove byte-identical accepted TEST8 baseline
        run: |
          echo "a48188b8ee20dc2256d745540f59c3a2e51a0b7d66758dc76f9677a411a021f9  artifacts/v407/gewitterradar.js" | sha256sum -c -
          echo "a48188b8ee20dc2256d745540f59c3a2e51a0b7d66758dc76f9677a411a021f9  artifacts/v407/gewitterradar-v4.07-test.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar.js)" -eq 1649138
      - name: Finalize TEST9R2 isolated location-query clear control
        run: node scripts/finalize-v407-test9-candidate.mjs
      - name: Check TEST9R2 generated JavaScript syntax
        run: node --check artifacts/v407/gewitterradar.js
      - name: Validate TEST9R2 isolated query-clear contract
        run: node scripts/test-v407-test9-candidate.mjs
      - name: Prove byte-identical real-accepted TEST9R2 baseline
        run: |
          echo "9d7f23d6307f1f232338446aabee19c88a1ddce1a0be1d534acea2b019fcf3b9  artifacts/v407/gewitterradar.js" | sha256sum -c -
          echo "9d7f23d6307f1f232338446aabee19c88a1ddce1a0be1d534acea2b019fcf3b9  artifacts/v407/gewitterradar-v4.07-test.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar.js)" -eq 1651359
      - name: Finalize TEST10 languages and firewall shield variant 2
        run: node scripts/finalize-v407-test10-candidate.mjs
      - name: Check TEST10 generated JavaScript syntax
        run: node --check artifacts/v407/gewitterradar.js
      - name: Validate complete 19-language V4.07 matrix on TEST9R2
        run: node scripts/test-v407-full-i18n-candidate.mjs
      - name: Validate TEST10 stabilization contract
        run: node scripts/test-v407-test10-candidate.mjs
      - name: Prove byte-identical TEST10 baseline
        run: |
          echo "a95e7b3346089f45e51c7ceebfc3d813b6bebac8cef56d3fa4cfa8dff37bd076  artifacts/v407/gewitterradar.js" | sha256sum -c -
          echo "a95e7b3346089f45e51c7ceebfc3d813b6bebac8cef56d3fa4cfa8dff37bd076  artifacts/v407/gewitterradar-v4.07-test.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar.js)" -eq 1769200
      - name: Finalize TEST10R1 desktop clear and visible V4.07.10
        run: node scripts/finalize-v407-test10r1-candidate.mjs
      - name: Check TEST10R1 generated JavaScript syntax
        run: node --check artifacts/v407/gewitterradar.js
      - name: Validate TEST10R1 desktop clear and visible version contract
        run: node scripts/test-v407-test10r1-candidate.mjs
      - name: Verify byte-identical aliases
        run: cmp artifacts/v407/gewitterradar.js artifacts/v407/gewitterradar-v4.07-test.js
      - name: Publish test JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: v407-location-search-test-js
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/v407/gewitterradar.js
            artifacts/v407/gewitterradar-v4.07-test.js
            artifacts/v407/SHA256SUMS.txt
