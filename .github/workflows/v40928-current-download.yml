name: Build V4.09.28 current download

on:
  push:
    branches:
      - feature/v4.09.28-coordinate-name-clear
    paths:
      - '.github/workflows/v40928-current-download.yml'
      - 'frontend/gewitterradar.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4.09.28 branch
        uses: actions/checkout@v4

      - name: Verify V4.09.28 frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/gewitterradar.js
          cmp -s frontend/gewitterradar.js custom_components/gewitterradar/frontend/gewitterradar.js
          cmp -s frontend/gewitterradar.js dashboard/dist/gewitterradar.js
          grep -Fq "const CARD_VERSION = '4.09.28';" frontend/gewitterradar.js
          grep -Fq "v407-coordinate-name-clear" frontend/gewitterradar.js
          grep -Fq "clearCoordinateNameButton" frontend/gewitterradar.js
          grep -Fq "v407-coordinate-latitude-clear" frontend/gewitterradar.js
          grep -Fq "v407-coordinate-longitude-clear" frontend/gewitterradar.js

      - name: Create V4.09.28 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/v40928
          mkdir -p build/v40928
          cp frontend/gewitterradar.js build/v40928/gewitterradar-v4.09.28.js
          (
            cd build/v40928
            zip -q ../Gewitterradar_v4.09.28.zip gewitterradar-v4.09.28.js
          )
          unzip -t build/Gewitterradar_v4.09.28.zip
          sha256sum build/Gewitterradar_v4.09.28.zip > build/Gewitterradar_v4.09.28.zip.sha256
          sha256sum build/v40928/gewitterradar-v4.09.28.js > build/gewitterradar-v4.09.28.js.sha256

      - name: Upload V4.09.28 package
        uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_v4.09.28
          path: |
            build/Gewitterradar_v4.09.28.zip
            build/Gewitterradar_v4.09.28.zip.sha256
            build/gewitterradar-v4.09.28.js.sha256
          if-no-files-found: error
          retention-days: 30
