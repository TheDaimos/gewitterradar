name: TEST70 OPERA WR-authoritative freshness
on:
  push:
    branches:
      - feature/test70-wr-authoritative-2026-11-03
    paths:
      - 'scripts/test70-release-ci.py'
      - '.github/workflows/test70-opera.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opera-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create, build and validate V4.11.121 candidate
        run: python scripts/test70-release-ci.py
      - name: Commit verified candidate on public TEST70 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && { echo "No version changes"; exit 1; }
          git commit -m "release(test70): Gewitterradar 4.11.121 DEV verified candidate"
          git push origin HEAD:feature/test70-wr-authoritative-2026-11-03
