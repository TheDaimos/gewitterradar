name: Historical Publish Gewitterradar V4.06

# V4.06 is already published and frozen. This historical publisher must never
# run automatically on later main versions. It remains available only for an
# explicit manual consistency/recovery run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v4-06:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify this is the frozen V4.06 commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin refs/tags/v4.06:refs/tags/v4.06
          tag_commit="$(git rev-parse 'refs/tags/v4.06^{commit}')"
          frozen_commit="$(git ls-remote --heads origin refs/heads/frozen/v4.06 | awk '{print $1}')"
          test -n "${tag_commit}"
          test "${tag_commit}" = "${frozen_commit}"
          echo "Historical V4.06 release/freeze commit: ${tag_commit}"

      - name: Verify V4.06 release metadata from frozen commit
        run: |
          set -euo pipefail
          v406="$(git rev-parse 'refs/tags/v4.06^{commit}')"
          git show "${v406}:docs/RELEASE_NOTES_V4_06.md" | grep -Fq 'Status: **Finaler Release-Stand.**'
          git show "${v406}:docs/RELEASE_NOTES_V4_06.md" | grep -Fq '15 Sprachen + 4 Dialektvarianten = 19'

      - name: Verify published V4.06 release remains immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin refs/tags/v4.06:refs/tags/v4.06
          tag_commit="$(git rev-parse 'refs/tags/v4.06^{commit}')"
          frozen_commit="$(git ls-remote --heads origin refs/heads/frozen/v4.06 | awk '{print $1}')"
          release_target="$(gh release view v4.06 --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq '.targetCommitish')"
          test "${tag_commit}" = "${frozen_commit}"
          test "${release_target}" = "${tag_commit}"
          echo "V4.06 remains published and frozen at ${tag_commit}."
