name: Prepare verified GewitterRadar V4.13 FINAL candidate
on:
  push:
    branches:
      - release/v4.13-final-candidate
    paths:
      - '.github/workflows/gr-prepare-v413-final.yml'
      - 'scripts/prepare-v413-final.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: gr-prepare-v413-final
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'TheDaimos/gewitterradar' && github.ref == 'refs/heads/release/v4.13-final-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify accepted source and independent PRE-MERGE CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45496499861 --jq .conclusion)" = success
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = 0bbb47772667c8ff252157ac6a6fab269877a0d6
          grep -Fq 'version:"4.13.7"' frontend/version.js
          grep -Fq 'displayVersion:"V4.13.7 DEV"' frontend/version.js
          grep -Fq 'integrationVersion:"0.25.185"' frontend/version.js
      - name: Preserve current main maintenance fixes before freeze
        run: |
          set -euo pipefail
          git config user.name 'TheDaimos Release Automation'
          git config user.email '157001884+TheDaimos@users.noreply.github.com'
          git merge -X ours --no-ff --no-edit refs/remotes/origin/main
          grep -Fq "checkbox.checked = storage.getItem(FIRST_STEPS_DISMISSED) === '1'" frontend/modules/ui/first-steps.js
          grep -Fq "else storage.removeItem(FIRST_STEPS_DISMISSED)" frontend/modules/ui/first-steps.js
      - name: Prepare strictly versioned final metadata and exact frontend deliveries
        run: |
          set -euo pipefail
          python scripts/prepare-v413-final.py
          node scripts/build-frontend.mjs
          node scripts/verify-frontend.mjs
          python scripts/verify-hacs-integration-package.py
          node scripts/verify-hires-asset-retention.mjs
          node scripts/verify-diagnostic-contract.mjs
          node scripts/verify-source-archive-contract.mjs
          python -m json.tool custom_components/gewitterradar/manifest.json >/dev/null
          git diff --check
      - name: Commit and push validated FINAL candidate
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'release(v4.13): freeze accepted moon legend and rebuild final install identities'
          fi
          test "$(grep -c 'displayVersion:"V4.13 FINAL"' frontend/version.js)" = 1
          test "$(python -c 'import json; print(json.load(open("custom_components/gewitterradar/manifest.json"))["version"])')" = '0.25.186'
          git push origin HEAD:refs/heads/release/v4.13-final-candidate
          echo "FINAL candidate commit: $(git rev-parse HEAD)"
