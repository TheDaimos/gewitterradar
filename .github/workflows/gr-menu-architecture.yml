name: GR Menu Architecture targeted acceptance
on:
  workflow_call:
    inputs:
      eye_bubble_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      eye_bubble_only:
        description: 'Only focused Eye Bubble Hub acceptance'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  menu-architecture:
    if: github.repository == 'TheDaimos/gewitterradar' && inputs.eye_bubble_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch protected pre-change menu reference
        run: git fetch --no-tags --depth=1 origin 7213b7aeffba5c6bc6fd2afb6bd74f84c88632b6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Targeted menus, source status and protected data paths
        run: |
          node --test tests/gr-menu-source-cards.test.mjs tests/gr-menu-architecture.test.mjs
          node scripts/verify-frontend.mjs
          node scripts/test-frontend-build.mjs
          node scripts/test-v411-identity.mjs
          node scripts/verify-hires-asset-retention.mjs
          find frontend -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/menu" --no-audit --no-fund playwright@1.56.1 leaflet@1.9.4
          "$RUNNER_TEMP/menu/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full real module tree, classic and modern, touch and desktop
        env:
          NODE_PATH: ${{ runner.temp }}/menu/node_modules
          GR_MENU_OUTPUT: ${{ runner.temp }}/menu-architecture-browser
        run: |
          node scripts/test-gr-menu-architecture-browser.cjs
          node scripts/test-gr-menu-hub-eye-browser.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Unchanged DRA channel and installable integration
        run: |
          python scripts/verify-hacs-integration-package.py
          python scripts/verify-deploy-relay-contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-architecture-synthetic-browser-results
          path: ${{ runner.temp }}/menu-architecture-browser
          if-no-files-found: ignore
  eye-bubble:
    if: github.repository == 'TheDaimos/gewitterradar' && inputs.eye_bubble_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Eye state, protected menu, master assets and shipped frontend
        run: |
          node scripts/test-eye-hub-model.mjs
          node scripts/test-eye-wow-model.mjs
          node --check frontend/modules/weather/eye-neon.js
          node --check frontend/modules/weather/display-quick.js
          node --check frontend/modules/weather/eye-hub.js
          node --check frontend/modules/weather/eye-hub-view.js
          node scripts/verify-frontend.mjs
          git diff --check HEAD~1 HEAD
      - name: Existing isolated browser toolchain
        run: |
          npm install --prefix "$RUNNER_TEMP/eye" --no-audit --no-fund playwright@1.56.1 leaflet@1.9.4
          "$RUNNER_TEMP/eye/node_modules/.bin/playwright" install --with-deps chromium
      - name: Focused Eye realtest correction, complete module tree and touch viewports
        env:
          NODE_PATH: ${{ runner.temp }}/eye/node_modules
        run: |
          node scripts/test-eye-hub-fix-browser.cjs
          node scripts/test-eye-neon-quick-browser.cjs
          node scripts/test-eye-organic-browser.cjs
          node scripts/test-eye-wow-browser.cjs
          node scripts/test-premium-geometry-browser.cjs
      - name: Installable DEV payload identity and parity
        run: |
          python scripts/build-dev-packages.py "$RUNNER_TEMP/eye-payload"
          python scripts/verify-eye-organic-packages.py "$RUNNER_TEMP/eye-payload"
