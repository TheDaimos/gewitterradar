name: Build V4.07.15 Help polish candidate

on:
  push:
    branches:
      - feature/v4.07-location-search-ui-next
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check TEST15 scripts
        run: |
          node --check scripts/v4-07-help-polish-test15-delta.mjs
          node --check scripts/finalize-v407-test15-candidate.mjs
          node --check scripts/test-v407-test15-candidate.mjs
      - name: Rebuild exact accepted chain through TEST15
        run: |
          node scripts/build-v407-location-search-candidate.mjs
          node scripts/finalize-v407-test8-candidate.mjs
          node scripts/finalize-v407-test9-candidate.mjs
          node scripts/finalize-v407-test10-candidate.mjs
          node scripts/finalize-v407-test10r1-candidate.mjs
          node scripts/finalize-v407-test11-candidate.mjs
          node scripts/finalize-v407-test12-candidate.mjs
          node scripts/finalize-v407-test13-candidate.mjs
          node scripts/finalize-v407-test14-candidate.mjs
          node scripts/finalize-v407-test15-candidate.mjs
      - name: Validate TEST15
        run: |
          node --check artifacts/v407/gewitterradar-v4.07.15.js
          node scripts/test-v407-test15-candidate.mjs
          cmp artifacts/v407/gewitterradar.js artifacts/v407/gewitterradar-v4.07.15.js
      - name: Publish TEST15
        uses: actions/upload-artifact@v4
        with:
          name: v407-test15-help-polish-js
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/v407/gewitterradar.js
            artifacts/v407/gewitterradar-v4.07.15.js
            artifacts/v407/SHA256SUMS.txt
