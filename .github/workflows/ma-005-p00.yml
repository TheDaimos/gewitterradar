name: MA-005 P00 Feature-OFF contract
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths: ['tests/test_ma005_off.py','scripts/test-ma-005-browser.cjs','.github/workflows/ma-005-p00.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          python -m pip install pytest-homeassistant-custom-component==0.13.362
          python -c "import importlib.metadata as m; assert 'homeassistant==2026.9.0b6' in m.requires('pytest-homeassistant-custom-component')"
          python -m pip install --no-deps --force-reinstall homeassistant==2026.9.0
      - run: |
          git rev-parse HEAD
          python -m pytest -q tests/test_ma005_off.py tests/test_migration_fresh_install.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1 leaflet@1.9.4
      - run: npx playwright install --with-deps chromium
      - run: |
          git rev-parse HEAD
          node scripts/test-ma-005-browser.cjs
