name: TEST70-49 seamless OPERA cycle swap public release
on:
  push:
    branches: [deploy/dev]
    paths:
      - 'scripts/test70-49-release-ci.py'
      - '.github/workflows/test70-49-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test70-49
  cancel-in-progress: false
jobs:
  verified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staging implementation and shipped parity
        run: |
          grep -q 'waitUntilReady(15000)' frontend/modules/weather/consumer-client.js
          grep -q 'metrics.loaded>0' frontend/modules/weather/p7-010/opera-diagnostic-tile.js
          cmp frontend/modules/weather/consumer-client.js dashboard/dist/modules/weather/consumer-client.js
          cmp frontend/modules/weather/p7-010/opera-diagnostic-tile.js dashboard/dist/modules/weather/p7-010/opera-diagnostic-tile.js
      - name: Version build SHA and regressions
        run: python scripts/test70-49-release-ci.py
      - name: Syntax and diff checks
        run: |
          node --check frontend/modules/weather/consumer-client.js
          node --check frontend/modules/weather/p7-010/opera-diagnostic-tile.js
          git diff --check
      - name: Publish public verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "release(test70-49): GR 4.11.128 staged OPERA PNG swap"
          git push origin HEAD:deploy/dev
