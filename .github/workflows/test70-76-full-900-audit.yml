name: TEST70-76 full repository 900-second audit
on:
  push:
    branches:
      - deploy/dev
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory every source occurrence of 900
        run: |
          python3 - <<'PY'
          import pathlib,re
          exts={'.py','.js','.json','.yaml','.yml','.ts','.tsx'}
          rows=[]
          for p in sorted(pathlib.Path('.').rglob('*')):
              if not p.is_file() or p.suffix not in exts or '.git' in p.parts: continue
              try: lines=p.read_text('utf-8').splitlines()
              except (UnicodeError,OSError): continue
              for n,line in enumerate(lines,1):
                  if re.search(r'(?<!\d)900(?!\d)|900000|15\s*\*\s*60',line):
                      rows.append((str(p),n,line.strip()[:240]))
          print(f'EXACT_900_OCCURRENCES={len(rows)}')
          for p,n,line in rows:
              print(f'{p}:{n}: {line}')
          sensitive=[(p,n,line) for p,n,line in rows if ('/weather/' in p or '/weather/' in ('/'+p)) and re.search(
              r'(?i)(max_data_age|validity|stale|expiry|freshness|frame_age|source_age|age_seconds|valid_until)',line) and re.search(r'(?<!\d)900(?!\d)|900000',line)]
          if sensitive:
              print('POLICY_REVIEW_REQUIRED:')
              for p,n,line in sensitive:print(f'{p}:{n}: {line}')
              raise SystemExit('Unreviewed 900-second policy literal found')
          PY
