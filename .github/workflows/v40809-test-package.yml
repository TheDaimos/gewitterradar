name: V4.08.09 Static Gold Session Test Package

on:
  push:
    branches:
      - feature/v4.08-cluster-zoom-and-cleanup
    paths:
      - 'scripts/build-v40803-storm-radius-fix.mjs'
      - 'scripts/build-v40804-cluster-session-countdown.py'
      - 'scripts/build-v40805-session-control-polish.py'
      - 'scripts/build-v40806-session-field-frame.py'
      - 'scripts/build-v40807-help-frame.py'
      - 'scripts/build-v40808-session-ab-compare.py'
      - 'scripts/build-v40809-session-static-gold.py'
      - '.github/workflows/v40809-test-package.yml'
      - 'frontend/**'
      - 'custom_components/gewitterradar/**'
      - 'dashboard/dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4.08 branch
        uses: actions/checkout@v4

      - name: Build deterministic V4.08.09 frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          {
            node scripts/build-v40803-storm-radius-fix.mjs
            python scripts/build-v40804-cluster-session-countdown.py
            python scripts/build-v40805-session-control-polish.py
            python scripts/build-v40806-session-field-frame.py
            python scripts/build-v40807-help-frame.py
            python scripts/build-v40808-session-ab-compare.py
            python scripts/build-v40809-session-static-gold.py
          } 2>&1 | tee build/v40809-build.log

      - name: Upload V4.08.09 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_V4.08.09_BUILD_LOG
          path: build/v40809-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated frontend and final B guards
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/gewitterradar.js
          cmp -s frontend/gewitterradar.js custom_components/gewitterradar/frontend/gewitterradar.js
          cmp -s frontend/gewitterradar.js dashboard/dist/gewitterradar.js
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('frontend/gewitterradar.js')
          s=p.read_text(encoding='utf-8')
          assert "const CARD_VERSION = '4.08.09';" in s
          assert 'V4.08.09-SESSION-STATIC-GOLD-2026-09-17' in s
          assert 'settings-cluster-session-static-gold' in s
          assert 'linear-gradient(110deg,rgba(116,78,15,.30),rgba(223,173,66,.30) 45%,rgba(255,218,128,.13) 70%,rgba(14,29,38,.20))' in s
          assert 'animation:none;' in s
          assert 'settings-cluster-session-variant-a' not in s
          assert 'settings-cluster-session-variant-b' not in s
          assert 'settings-cluster-session-ab-stack' not in s
          assert 'v40808-gold-ltr' not in s
          assert 'v40808-gold-rtl' not in s
          assert 'settings-cluster-jump-selector-a' not in s
          assert 'settings-cluster-jump-selector-b' not in s
          assert 'transform:scale(1.25);transform-origin:center;' in s
          assert 'max-height:clamp(230px,calc(100dvh - 490px),560px)!important' in s
          assert "label += ' ∞';" in s
          assert "label += ` · ${Math.ceil(remainingMs / 1000)}s`;" in s
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          print('Frontend SHA256',digest)
          print('V4.08.09 static B UI guards OK')
          PY

      - name: Create installable V4.08.09 test ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/v40809
          mkdir -p build/v40809/native/custom_components build/v40809/dashboard
          cp -a custom_components/gewitterradar build/v40809/native/custom_components/
          cp -a dashboard/dist/. build/v40809/dashboard/
          mv build/v40809/dashboard/gewitterradar.js build/v40809/dashboard/gewitterradar-v4.08.09.js
          test -f build/v40809/dashboard/gewitterradar-v4.08.09.js
          test ! -e build/v40809/dashboard/gewitterradar.js
          cmp -s frontend/gewitterradar.js build/v40809/dashboard/gewitterradar-v4.08.09.js
          cat > build/v40809/README_V4.08.09_TEST.txt <<'TXT'
          Gewitterradar V4.08.09 TEST
          ===========================

          Neu in V4.08.09:
          - A/B-Vergleich beendet: Variante B ist der gewählte Zielzustand.
          - Nur noch ein Sitzungszeit-Feld im Radien-Menü.
          - Statische Goldbetonung nur auf der jeweils aktiven Seite.
          - Keine Verlaufsanimation und kein Richtungswechsel mehr.
          - Sekundenwert und Unendlich-Modus bleiben funktional unverändert.
          - Das Unicode-Unendlich-Zeichen bleibt vorerst Platzhalter für die spätere Hi-Res-Grafik.
          - Dartscheibe +25 Prozent und interner Radien-Scrollbereich bleiben erhalten.

          Dashboard-/Dev-Test:
          Datei:
            dashboard/gewitterradar-v4.08.09.js

          Ziel:
            /config/www/community/gewitterradar-dashboard/gewitterradar-v4.08.09.js

          Ressource:
            /hacsfiles/gewitterradar-dashboard/gewitterradar-v4.08.09.js?v=40809

          Ressourcentyp:
            JavaScript-Modul

          Package:
          app_gewitterradar_v4_07_pkg.yaml bleibt unverändert verwendbar.
          TXT
          (
            cd build/v40809
            zip -qr ../Gewitterradar_V4.08.09_TEST.zip .
          )
          unzip -t build/Gewitterradar_V4.08.09_TEST.zip
          sha256sum build/Gewitterradar_V4.08.09_TEST.zip | tee build/Gewitterradar_V4.08.09_TEST.sha256
          sha256sum frontend/gewitterradar.js | tee build/gewitterradar-v40809-frontend.sha256
          sha256sum dashboard/dist/app_gewitterradar_v4_07_pkg.yaml | tee build/app_gewitterradar_v4_07_pkg.sha256
          test "$(cut -d' ' -f1 build/app_gewitterradar_v4_07_pkg.sha256)" = "1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694"

      - name: Upload V4.08.09 test package
        uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_V4.08.09_TEST
          path: |
            build/Gewitterradar_V4.08.09_TEST.zip
            build/Gewitterradar_V4.08.09_TEST.sha256
            build/gewitterradar-v40809-frontend.sha256
            build/app_gewitterradar_v4_07_pkg.sha256
          if-no-files-found: error
          retention-days: 30
