name: GR release PRE-MERGE backup
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Final product version, e.g. 4.13"
        required: true
        type: string
      expected_main_sha:
        description: "Exact old main commit (40 hex chars)"
        required: true
        type: string
  push:
    branches:
      - 'release/premerge/**'
    paths:
      - 'docs/release-control/premerge-request.json'
permissions:
  contents: read
concurrency:
  group: gr-release-premerge
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate request and pin original main
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            values="$(python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('docs/release-control/premerge-request.json')
          obj=json.loads(p.read_text())
          assert re.fullmatch(r'4\.[0-9]{2}',obj['version'])
          assert re.fullmatch('[0-9a-f]{40}',obj['expected_main_sha'])
          print(obj['version'],obj['expected_main_sha'])
          PY
          )"
            read -r version expected <<< "$values"
          else
            version="$INPUT_VERSION"; expected="$INPUT_SHA"
          fi
          [[ "$version" =~ ^4\.[0-9]{2}$ ]]
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$expected"
          git checkout --detach "$expected"
          {
            echo "version=$version"
            echo "old_sha=$expected"
          } >> "$GITHUB_OUTPUT"
      - name: Create and validate complete source backup
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/create-source-archive.sh PRE_MERGE "${{ steps.request.outputs.old_sha }}" "V${{ steps.request.outputs.version }}" dist/source-archives
          (cd dist/source-archives && sha256sum -c *_SHA256SUMS.txt)
          for archive in dist/source-archives/*.zip; do unzip -tq "$archive"; done
          for bundle in dist/source-archives/*.bundle; do git bundle verify "$bundle"; done
          printf 'version=%s\nold_main_sha=%s\n' "${{ steps.request.outputs.version }}" "${{ steps.request.outputs.old_sha }}" > dist/source-archives/PRE_MERGE_IDENTITY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GR_PRE_MERGE_V${{ steps.request.outputs.version }}_${{ steps.request.outputs.old_sha }}
          path: dist/source-archives/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
