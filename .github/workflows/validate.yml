name: Validate HACS and publish V4.03

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verify-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rebuild HACS distribution
        run: node scripts/build-hacs-dist.mjs
      - name: Verify generated files are committed
        run: git diff --exit-code -- dist/gewitterradar.js
      - name: Verify HACS distribution and zero-asset release layout
        run: node scripts/verify-hacs-dist.mjs
      - name: Verify complete V4.03 source package internally
        run: python3 scripts/build-release-package.py "${RUNNER_TEMP}/gewitterradar-v4_03.zip"

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          ignore: license images

  publish-v4-03:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify-dist
      - validate-hacs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Publish V4.03 without custom release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.03 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v4.03 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v4.03 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Gewitterradar V4.03" \
            --notes-file RELEASE_NOTES_V4_03.md
