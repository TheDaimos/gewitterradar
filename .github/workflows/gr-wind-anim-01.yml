name: WR-GR-WIND-ANIM-01 numeric windfield and full card
on:
  workflow_call:
permissions:
  contents: read
jobs:
  wind-field:
    if: github.repository == 'TheDaimos/gewitterradar'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Immutable protected UI references
        run: git fetch --no-tags --depth=1 origin d975a94be5d63eb09242a54920d8c3417205b41f 4adb7a8c186a45f5b0246982a99cfac6ec28d44e
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Numeric field, wind controls and protected precipitation contracts
        run: node --test tests/gr-wind-anim-01.test.mjs tests/gr-wind-fix-01.test.mjs tests/gr-wind-ui-03.test.mjs tests/gr-legend-ui-01.test.mjs
      - name: Delivery and version consistency
        run: |
          node scripts/verify-frontend.mjs
          node scripts/test-v411-identity.mjs
      - name: Isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/wind-anim01" --no-audit --no-fund playwright@1.56.1 leaflet@1.9.4
          "$RUNNER_TEMP/wind-anim01/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full card windfield and five desktop/mobile viewports
        env:
          NODE_PATH: ${{ runner.temp }}/wind-anim01/node_modules
          GR_WIND_OUTPUT: ${{ runner.temp }}/wind-anim01-output
        run: |
          node scripts/test-gr-wind-anim-01-browser.cjs
          node scripts/test-gr-wind-fix-01-browser.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Installable integration package
        run: python scripts/verify-hacs-integration-package.py
