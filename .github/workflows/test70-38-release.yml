name: TEST70-38 GR 4.11.122 authenticated preview release
on:
  push:
    branches: [deploy/dev]
    paths:
      - 'scripts/test70-38-release-ci.py'
      - '.github/workflows/test70-38-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test70-38-gr-release
  cancel-in-progress: false
jobs:
  verified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact base identity
        run: |
          test "$(git branch --show-current)" = deploy/dev
          grep -q 'version:"4.11.121"' frontend/version.js
          grep -q '"version": "0.25.30"' custom_components/gewitterradar/manifest.json
      - name: Version bump, frontend build, SHA and regression
        run: python scripts/test70-38-release-ci.py
      - name: Verify javascript and staging
        run: |
          node --check frontend/modules/weather/p7-010/opera-diagnostic-tile.js
          git diff --check
          git status --short
      - name: Commit and push verified release to public deploy/dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "release(test70-38): Gewitterradar 4.11.122 DEV authenticated OPERA guard"
          git push origin HEAD:deploy/dev
