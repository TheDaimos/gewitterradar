name: Moon 4.13.2 focused delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-scope-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify targeted scope and canonical delivery
        run: |
          node scripts/test-moon-4132-scope.mjs
          node scripts/verify-current-frontend.mjs
          python scripts/test-moon-4132-schema.py
      - name: Build both deterministic packages from committed source
        run: python scripts/build-dev-packages.py "$RUNNER_TEMP/moon-packages"
      - uses: actions/upload-artifact@v4
        with:
          name: moon-4132-dev-packages
          path: ${{ runner.temp }}/moon-packages/
