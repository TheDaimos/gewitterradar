name: Materialize Gewitterradar V4.09 release candidate

on:
  push:
    branches:
      - release/v4.09
    paths:
      - '.release-staging/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'release: materialize V4.09 accepted build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize accepted V4.09.24 payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .release-staging/v409-final-gewitterradar.js.gz
          test -f .release-staging/v409-final-about-locales.js.gz
          test -f .release-staging/gewitterradar-compass-toggle.png.gz
          gzip -dc .release-staging/v409-final-gewitterradar.js.gz > frontend/gewitterradar.js
          gzip -dc .release-staging/v409-final-about-locales.js.gz > frontend/locales/about-locales.js
          gzip -dc .release-staging/gewitterradar-compass-toggle.png.gz > frontend/assets/gewitterradar-compass-toggle.png
          test "$(sha256sum frontend/gewitterradar.js | awk '{print $1}')" = '2dad877e61654f5261650511f595820e55a8432fcdb0f7387f75bfb9e0271b1f'
          test "$(wc -c < frontend/gewitterradar.js | tr -d ' ')" = '2234030'
          test "$(sha256sum frontend/locales/about-locales.js | awk '{print $1}')" = 'dc6506291dd4cfe75e3b9c829fb42f21062511fb574d335af438e6c42711802e'
          test "$(wc -c < frontend/locales/about-locales.js | tr -d ' ')" = '741069'
          test "$(sha256sum frontend/assets/gewitterradar-compass-toggle.png | awk '{print $1}')" = 'bd6ce5bbd20a9db8af174f14ff284461c41e0ee620443f5e42b9c298e9072a0a'

      - name: Rebuild both delivery forms
        run: |
          set -euo pipefail
          node scripts/build-frontend.mjs
          node scripts/verify-frontend.mjs
          node --check frontend/gewitterradar.js
          node --check frontend/locales/about-locales.js
          python -m json.tool custom_components/gewitterradar/manifest.json >/dev/null

      - name: Remove staging payload and commit materialized release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: materialize V4.09 accepted build'
          git push origin HEAD:release/v4.09
