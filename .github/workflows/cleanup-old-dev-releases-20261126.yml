name: Cleanup superseded DEV releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-old-dev-releases-20261126.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only explicitly approved superseded prereleases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for id in 448665770 448605943 448349015 457206639 457148207 456948012 456781475 456695860 456564096; do
            echo "Checking release ID $id"
            if ! release=$(gh api "repos/$GH_REPO/releases/$id"); then
              failed=1
              continue
            fi
            if ! jq -e '.prerelease == true and (.tag_name | test("^v4[.](11|12|13)[.][0-9]+-dev$"))' <<< "$release" >/dev/null; then
              failed=1
              continue
            fi
            if gh api --method DELETE "repos/$GH_REPO/releases/$id"; then
              echo "Removed release $id; Git tag retained"
            else
              failed=1
            fi
          done
          exit "$failed"
