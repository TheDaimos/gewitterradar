name: MA-013 Vault profile and link contracts
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths:
      - 'custom_components/gewitterradar/settings_vault.py'
      - 'custom_components/gewitterradar/monitored_areas/identity.py'
      - 'scripts/test-ma-013.py'
      - '.github/workflows/ma-013.yml'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          git rev-parse HEAD
          python -m compileall -q custom_components/gewitterradar/monitored_areas custom_components/gewitterradar/settings_vault.py
          python scripts/test-ma-013.py
          python scripts/test-ma-012.py
