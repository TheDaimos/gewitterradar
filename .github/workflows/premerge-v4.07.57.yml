name: Capture V4.07.57 PRE-MERGE snapshot

on:
  push:
    branches:
      - release/v4.07.57
    paths:
      - '.github/workflows/premerge-v4.07.57.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical main
        run: git fetch origin '+refs/heads/main:refs/remotes/origin/main' --force

      - name: Create PRE-MERGE archive of current main
        id: archive
        run: |
          set -euo pipefail
          chmod +x scripts/create-source-archive.sh
          scripts/create-source-archive.sh PRE_MERGE refs/remotes/origin/main V4.07.57 dist/source-archives

      - name: Verify archive set
        run: |
          set -euo pipefail
          test -s '${{ steps.archive.outputs.zip_path }}'
          test -s '${{ steps.archive.outputs.bundle_path }}'
          test -s '${{ steps.archive.outputs.checksum_path }}'
          (cd dist/source-archives && sha256sum -c "$(basename '${{ steps.archive.outputs.checksum_path }}')")
          unzip -tq '${{ steps.archive.outputs.zip_path }}'
          git bundle verify '${{ steps.archive.outputs.bundle_path }}'
          echo "PRE_MERGE_MAIN_SHA=$(git rev-parse refs/remotes/origin/main^{commit})"

      - uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_V4.07.57_PRE_MERGE
          path: dist/source-archives/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
