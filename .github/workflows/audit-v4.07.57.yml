name: Inspect Gewitterradar V4.07.57 build metadata

on:
  push:
    branches:
      - release/v4.07.57
    paths:
      - '.github/workflows/audit-v4.07.57.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect version and build anchors
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('frontend/gewitterradar.js').read_text(encoding='utf-8')
          for needle in ['GEWITTERRADAR_BUILD','CARD_VERSION','CARD_DISPLAY_VERSION','TEST56','2026-09-16']:
              print(f'=== {needle} ===')
              pos=0
              found=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  print(s[max(0,i-100):min(len(s),i+220)].replace('\n','\\n'))
                  found+=1
                  pos=i+len(needle)
                  if found>=10: break
              print('count_shown=',found)
          PY
