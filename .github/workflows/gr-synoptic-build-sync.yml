name: GR Synoptik - synchronize public DEV delivery
on:
  push:
    branches: [deploy/dev]
    paths: ['.github/workflows/gr-synoptic-build-sync.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/dev
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild canonical asset integrity inventory
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const path='frontend/assets.json';
          const list=JSON.parse(await readFile(path,'utf8'));
          const targets=['assets/gewitterradar-runtime-manifest.json','assets/gr-synoptic-high-low-isobars-premium-original.png','assets/gewitterradar-about-close-premium.webp'];
          for(const file of targets){
            const bytes=await readFile('frontend/'+file);
            const sha256=createHash('sha256').update(bytes).digest('hex');
            let item=list.find(x=>x.file===file);
            if(!item){item={file,sha256,protected:true};list.push(item);}
            item.sha256=sha256;
            if(file==='assets/gewitterradar-about-close-premium.webp')item.referenced=true;
            if('sizeBytes' in item)item.sizeBytes=bytes.length;
          }
          list.sort((a,b)=>a.file.localeCompare(b.file,'en'));
          await writeFile(path,JSON.stringify(list,null,2)+'\n');
          NODE
      - name: Build mirrored installable frontend and checksum inventory
        run: node scripts/build-frontend.mjs
      - name: Verify canonical release, package mirrors and identities
        run: node scripts/verify-current-frontend.mjs
      - name: Commit only release integrity files (public repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/assets.json SHA256SUMS_FRONTEND.txt custom_components/gewitterradar/frontend dashboard/dist
          if git diff --cached --quiet; then
            echo "Delivery already synchronized"
          else
            git commit -m "build(synoptic): synchronize GR DEV delivery mirrors and signed asset inventory"
            git push origin HEAD:deploy/dev
          fi
