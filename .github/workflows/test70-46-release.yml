name: TEST70-46 GR lifecycle public release
on:
  push:
    branches: [deploy/dev]
    paths:
      - '.github/workflows/test70-46-release.yml'
      - 'scripts/test70-46-release-ci.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test70-46
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align all shipped frontend copies
        run: |
          cp frontend/modules/weather/consumer-client.js custom_components/gewitterradar/frontend/modules/weather/consumer-client.js
          cp frontend/modules/weather/consumer-client.js dashboard/dist/modules/weather/consumer-client.js
      - name: Version, build, SHA and regression
        run: python scripts/test70-46-release-ci.py
      - name: Syntax and integrity
        run: |
          node --check frontend/modules/weather/consumer-client.js
          node --check frontend/modules/weather/p7-010/opera-diagnostic-tile.js
          git diff --check
      - name: Publish public DEV commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "release(test70-46): GR 4.11.126 persistent OPERA cycle polling"
          git push origin HEAD:deploy/dev
