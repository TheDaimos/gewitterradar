name: Publish Gewitterradar V4.10
on:
  push:
    branches: [main]
    paths: ['docs/archive-triggers/V4_10_PUBLISH.trigger']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact public identity and predecessor archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          grep -Fx 'VERSION=V4.10' docs/archive-triggers/V4_10_PUBLISH.trigger
          grep -Fx 'ACCEPTED_R40=bcf30fe2dc1b6b56625edf209b2373b956fb7fd4' docs/archive-triggers/V4_10_PUBLISH.trigger
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/36713110734 --jq '.conclusion')" = success
          grep -Fqx "const CARD_VERSION = '4.10';" frontend/gewitterradar.js
          grep -Fqx "const CARD_DISPLAY_VERSION = '4.10';" frontend/gewitterradar.js
          grep -Fqx "const GEWITTERRADAR_BUILD = 'V4.10-RELEASE-2026-09-30';" frontend/gewitterradar.js
          grep -Fx 'BUILD_VERSION = "4.10"' custom_components/gewitterradar/build_info.py
          test "$(python -c 'import json; print(json.load(open("custom_components/gewitterradar/manifest.json"))["version"])')" = '0.22.0'
      - name: Run release contracts on exact main commit
        run: |
          set -euo pipefail
          node scripts/verify-frontend.mjs
          node scripts/verify-diagnostic-contract.mjs
          node scripts/verify-hires-asset-retention.mjs
          node scripts/verify-source-archive-contract.mjs
          bash -n scripts/create-source-archive.sh
          python scripts/verify-hacs-integration-package.py
          python -m json.tool custom_components/gewitterradar/manifest.json >/dev/null
          node --check frontend/gewitterradar.js
          sha256sum -c SHA256SUMS_FRONTEND.txt
      - name: Wait for exact post-merge CI gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=('Validate Gewitterradar integration' 'Validate shared Gewitterradar frontend' 'Diagnostic contract' 'Hi-Res asset retention')
          for attempt in $(seq 1 180); do
            data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            waiting=0
            for name in "${required[@]}"; do
              row="$(printf '%s' "$data" | jq -r --arg name "$name" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')"
              echo "$name -> $row"
              case "$row" in completed:success) ;; completed:*) exit 1 ;; *) waiting=1 ;; esac
            done
            if [ "$waiting" -eq 0 ]; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Build and verify Golden Master of exact new main
        id: golden
        run: |
          set -euo pipefail
          chmod +x scripts/create-source-archive.sh
          scripts/create-source-archive.sh GOLDEN_MASTER "$GITHUB_SHA" V4.10 dist/source-archives
          zip="$(find dist/source-archives -maxdepth 1 -type f -name 'Gewitterradar_V4.10_GOLDEN_MASTER_*.zip' -print -quit)"
          bundle="$(find dist/source-archives -maxdepth 1 -type f -name 'Gewitterradar_V4.10_GOLDEN_MASTER_*.bundle' -print -quit)"
          checksums="$(find dist/source-archives -maxdepth 1 -type f -name 'Gewitterradar_V4.10_GOLDEN_MASTER_*_SHA256SUMS.txt' -print -quit)"
          test -n "$zip" && test -s "$zip"
          test -n "$bundle" && test -s "$bundle"
          test -n "$checksums" && test -s "$checksums"
          (cd dist/source-archives && sha256sum -c "$(basename "$checksums")")
          unzip -tq "$zip"
          git bundle verify "$bundle"
      - name: Upload immutable Golden Master
        uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_V4.10_GOLDEN_MASTER
          path: dist/source-archives/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Freeze exact release commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if git ls-remote --exit-code --heads origin refs/heads/frozen/v4.10 >/dev/null 2>&1; then
            test "$(git ls-remote --heads origin refs/heads/frozen/v4.10 | cut -f1)" = "$sha"
          else
            git push origin "$sha:refs/heads/frozen/v4.10"
          fi
          if gh release view v4.10 >/dev/null 2>&1; then
            git fetch origin refs/tags/v4.10:refs/tags/v4.10 --force
            test "$(git rev-list -n1 v4.10)" = "$sha"
          else
            gh release create v4.10 --target "$sha" --title 'Gewitterradar V4.10' --notes-file docs/RELEASE_NOTES_V4_10.md --latest
          fi
          git fetch origin refs/tags/v4.10:refs/tags/v4.10 --force
          test "$(git rev-list -n1 v4.10)" = "$sha"
          gh release view v4.10 --json tagName,isDraft,isPrerelease,url,targetCommitish
