name: Publish GewitterRadar V4.11.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v4.11.2.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply default and build complete maintenance release
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path
          for name, old, new in [
            ('custom_components/gewitterradar/const.py','    CONF_SHOW_LOCATION_SELECTOR: False,','    CONF_SHOW_LOCATION_SELECTOR: True,'),
            ('tests/test_settings.py','    "show_location_selector": False,','    "show_location_selector": True,'),
            ('tests/test_migration_fresh_install.py','    "show_location_selector": False,','    "show_location_selector": True,'),
          ]:
            p=Path(name); s=p.read_text(); assert s.count(old)==1, name; p.write_text(s.replace(old,new))
          PY
          node scripts/sync-dev-release.mjs "$base"
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('frontend/version.js'); s=p.read_text(); assert 'displayVersion:"V4.11.254 DEV"' in s
          p.write_text(s.replace('displayVersion:"V4.11.254 DEV"','displayVersion:"V4.11.2 FINAL"').replace('V4.11.254-DEV-','V4.11.2-FINAL-'))
          p=Path('frontend/assets/gewitterradar-runtime-manifest.json'); d=json.loads(p.read_text()); d['build']=d['build'].replace('V4.11.254-DEV-','V4.11.2-FINAL-'); d['displayVersion']='V4.11.2 FINAL'; p.write_text(json.dumps(d,indent=2)+'\n')
          a=Path('frontend/assets.json'); rows=json.loads(a.read_text()); row=next(x for x in rows if x['file']=='assets/gewitterradar-runtime-manifest.json'); raw=p.read_bytes(); row['sha256']=hashlib.sha256(raw).hexdigest(); row['sizeBytes']=len(raw); a.write_text(json.dumps(rows,indent=2)+'\n')
          p=Path('custom_components/gewitterradar/dra-deployment-provenance.json'); d=json.loads(p.read_text()); d['build']=d['build'].replace('V4.11.254-DEV-','V4.11.2-FINAL-'); d['deployment']['purpose']='Location selector enabled by default for fresh setups; explicit settings retained.'; p.write_text(json.dumps(d,indent=2)+'\n')
          Path('docs/RELEASE_NOTES_V4_11_2_FINAL.md').write_text('# GewitterRadar V4.11.2 FINAL – Standortwahl\n\nDie Standortwahl in der Hauptansicht ist bei Neuinstallationen standardmäßig eingeschaltet. Bereits gespeicherte Einstellungen bleiben erhalten. Alle anderen Standardeinstellungen und Wetterfunktionen bleiben unverändert.\n\nInterne Produktversion 4.11.254, HA-Integration 0.25.161.\n')
          PY
          node scripts/build-frontend.mjs
          node scripts/verify-current-frontend.mjs
          python scripts/check-static.py
          python scripts/verify-hacs-integration-package.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components frontend dashboard SHA256SUMS_FRONTEND.txt tests docs/RELEASE_NOTES_V4_11_2_FINAL.md
          git commit -m 'release(4.11.2): enable location selector by default'
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Archive and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          node scripts/verify-frontend.mjs
          bash scripts/create-source-archive.sh GOLDEN_MASTER "$RELEASE_SHA" V4.11.2 dist/source-archives
          (cd dist/source-archives && for checksums in *_SHA256SUMS.txt; do sha256sum -c "$checksums"; done)
          if gh release view v4.11.2 >/dev/null 2>&1; then echo 'Existing release; refusing overwrite'; exit 1; fi
          gh release create v4.11.2 dist/source-archives/* --target "$RELEASE_SHA" --title 'GewitterRadar V4.11.2 FINAL – Standortwahl' --notes-file docs/RELEASE_NOTES_V4_11_2_FINAL.md --latest
