name: GR Synoptik DEV - targeted regression
on:
  push:
    branches: [deploy/dev]
    paths:
      - 'frontend/modules/weather/synoptic-display.js'
      - 'frontend/modules/weather/eye-hub*.js'
      - 'frontend/modules/weather/display-menu.js'
      - 'frontend/modules/weather/wind-display.js'
      - 'frontend/gewitterradar.js'
      - 'frontend/module-manifest.js'
      - 'frontend/version.js'
      - 'frontend/assets/gewitterradar-runtime-manifest.json'
      - 'custom_components/gewitterradar/frontend/**'
      - 'dashboard/dist/**'
      - 'tests/synoptic-dev-v411198.test.mjs'
      - 'scripts/test-synoptic-browser.cjs'
      - '.github/workflows/gr-synoptic-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synoptic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: P1 Settings Vault schema and stale-session merge regressions
        run: python -m unittest discover -s tests -p 'test_synoptic_p1_schema.py' -v
      - name: Synoptic isolated contract and mirror checks
        run: node --test tests/synoptic-dev-v411198.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1 leaflet@1.9.4
      - run: npx playwright install --with-deps chromium
      - name: Synoptic Leaflet and Android touch regression
        run: node scripts/test-synoptic-browser.cjs
