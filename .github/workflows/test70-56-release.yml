name: GR TEST70-56 verified public DEV release
on:
  push:
    branches: [deploy/dev]
    paths:
      - 'scripts/test70-56-release-ci.py'
      - '.github/workflows/test70-56-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gr-test70-56-release
  cancel-in-progress: false
jobs:
  regression-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared precipitation and OPERA modules
        run: |
          node --check frontend/modules/weather/precipitation-layer.js
          node --check frontend/modules/weather/consumer-client.js
          node --test tests/test70-55-unified-precipitation.test.mjs
      - name: Build version and run regression suite
        run: python scripts/test70-56-release-ci.py
      - name: Commit release only after all checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "release(test70-56): GR 4.11.135 unified precipitation"
          git pull --rebase origin deploy/dev
          git push origin HEAD:deploy/dev
