name: Prepare Gewitterradar V4.07.57

on:
  push:
    branches:
      - release/v4.07.57
    paths:
      - '.github/workflows/prepare-v4.07.57.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare version-only frontend patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/gewitterradar.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('Gewitterradar Card V4.07.56', 'Gewitterradar Card V4.07.57'),
              ("const CARD_VERSION = '4.07.56';", "const CARD_VERSION = '4.07.57';"),
              ("const CARD_DISPLAY_VERSION = '4.07.56';", "const CARD_DISPLAY_VERSION = '4.07.57';"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          if '4.07.56' in text or 'V4.07.56' in text:
              raise SystemExit('Unexpected additional V4.07.56 marker remains in canonical frontend')
          path.write_text(text, encoding='utf-8')
          PY

          sha=$(sha256sum frontend/gewitterradar.js | awk '{print $1}')
          size=$(wc -c < frontend/gewitterradar.js | tr -d ' ')
          echo "V4.07.57 frontend: ${size} bytes, SHA256 ${sha}"

          python - "$sha" "$size" <<'PY'
          import json, sys
          from pathlib import Path
          sha, size = sys.argv[1], int(sys.argv[2])
          contract = {
              'contractVersion': 1,
              'version': '4.07.57',
              'nativeIntegration': '0.19.1',
              'sha256': sha,
              'sizeBytes': size,
              'baselineVersion': '4.07.56',
              'baselineSha256': '249485f4bcf68c9b23b821cae9b507030ae09cff5a56f7e28d3d7f3b02eb4a1a',
              'baselineSizeBytes': 1955141,
              'allowedFrontendDelta': 'version markers only; runtime behavior remains the protected V4.07.56 baseline',
          }
          Path('tests/contracts/frontend-release-v4.07.57.json').write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Update deterministic frontend build contract
        run: |
          set -euo pipefail
          cat > scripts/build-frontend.mjs <<'EOF'
          import {readFile,writeFile,mkdir,readdir} from 'node:fs/promises';
          import {resolve,dirname} from 'node:path';
          import {fileURLToPath} from 'node:url';
          import {createHash} from 'node:crypto';
          import {readAboutLocaleModel} from './verify-about-locales.mjs';
          export const root=resolve(dirname(fileURLToPath(import.meta.url)),'..');
          export const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const baselineFrontendSha='249485f4bcf68c9b23b821cae9b507030ae09cff5a56f7e28d3d7f3b02eb4a1a';
          const baselineFrontendSize=1955141;
          const normalizeV40757ToBaseline=text=>text
           .replace('Gewitterradar Card V4.07.57','Gewitterradar Card V4.07.56')
           .replace("const CARD_VERSION = '4.07.57';","const CARD_VERSION = '4.07.56';")
           .replace("const CARD_DISPLAY_VERSION = '4.07.57';","const CARD_DISPLAY_VERSION = '4.07.56';");
          export async function expectedPayload(){
           const baseline=JSON.parse(await readFile(resolve(root,'tests/contracts/diagnostic-contract-v4.07.56.json'),'utf8'))?.acceptedSource;
           if(baseline?.sha256!==baselineFrontendSha||baseline?.sizeBytes!==baselineFrontendSize)throw Error('Protected V4.07.56 source contract changed');
           const release=JSON.parse(await readFile(resolve(root,'tests/contracts/frontend-release-v4.07.57.json'),'utf8'));
           if(release?.version!=='4.07.57'||release?.baselineVersion!=='4.07.56'||release?.baselineSha256!==baselineFrontendSha||release?.baselineSizeBytes!==baselineFrontendSize)throw Error('V4.07.57 release contract metadata changed');
           const source=await readFile(resolve(root,'frontend/gewitterradar.js'));
           if(source.length!==release.sizeBytes||hash(source)!==release.sha256)throw Error('Frontend differs from V4.07.57 release contract');
           const sourceText=source.toString('utf8');
           if(!sourceText.includes("const CARD_VERSION = '4.07.57';")||!sourceText.includes("const CARD_DISPLAY_VERSION = '4.07.57';"))throw Error('V4.07.57 version markers missing');
           const normalized=Buffer.from(normalizeV40757ToBaseline(sourceText),'utf8');
           if(normalized.length!==baselineFrontendSize||hash(normalized)!==baselineFrontendSha)throw Error('V4.07.57 frontend contains changes beyond the approved version markers');
           const localeSource=await readFile(resolve(root,'frontend/locales/about-locales.js'));
           readAboutLocaleModel(sourceText,localeSource.toString());
           const inventory=JSON.parse(await readFile(resolve(root,'frontend/assets.json'),'utf8'));
           const referenced=[...new Set([...sourceText.matchAll(/new URL\('\.\/(assets\/[^'?]+)(?:\?[^']*)?', import.meta.url\)/g)].map(m=>m[1]))].sort();
           const activeInventory=inventory.filter(a=>a.referenced!==false).map(a=>a.file).sort();
           const retainedInventory=inventory.filter(a=>a.referenced===false);
           if(inventory.length!==17||new Set(inventory.map(a=>a.file)).size!==17||activeInventory.length!==16||JSON.stringify(referenced)!==JSON.stringify(activeInventory))throw Error('Asset inventory/reference mismatch');
           if(retainedInventory.length!==1||retainedInventory[0].file!=='assets/gewitterradar-about-close-premium.webp'||retainedInventory[0].retention!=='legacy')throw Error('Retained legacy asset contract changed');
           const actual=(await readdir(resolve(root,'frontend/assets'))).map(n=>'assets/'+n).sort();
           const inventoried=inventory.map(a=>a.file).sort();
           if(JSON.stringify(actual)!==JSON.stringify(inventoried))throw Error('Unexpected/missing source assets');
           const frozenHashes=await readFile(resolve(root,'docs/V4_05_FRONTEND_REFERENCE_SHA256SUMS.txt'),'utf8');
           const payload=new Map([['gewitterradar.js',source],['locales/about-locales.js',localeSource]]);
           for(const asset of inventory){
            const bytes=await readFile(resolve(root,'frontend',asset.file));
            if(hash(bytes)!==asset.sha256)throw Error('Asset SHA mismatch '+asset.file);
            if(asset.protected&&!frozenHashes.includes(asset.sha256+'  dist/'+asset.file))throw Error('Protected V4.05 asset changed '+asset.file);
            payload.set(asset.file,bytes);
           }
           return payload;
          }
          export const destinations=['custom_components/gewitterradar/frontend','dashboard/dist'];
          export const dashboardPackages=[
           ['home-assistant/app_gewitterradar_v4_06_pkg.yaml','app_gewitterradar_v4_06_pkg.yaml'],
           ['home-assistant/app_gewitterradar_v4_07_pkg.yaml','app_gewitterradar_v4_07_pkg.yaml'],
          ];
          export async function expectedDashboardPackages(){
           const packages=new Map();
           for(const [sourceName,targetName] of dashboardPackages){
            const text=(await readFile(resolve(root,sourceName),'utf8')).replace(/\r\n?/g,'\n');
            packages.set(targetName,Buffer.from(text,'utf8'));
           }
           return packages;
          }
          export async function build(){
           const payload=await expectedPayload();
           for(const destination of destinations)for(const [name,bytes] of payload){const target=resolve(root,destination,name);await mkdir(dirname(target),{recursive:true});await writeFile(target,bytes);}
           const packages=await expectedDashboardPackages();
           for(const [name,bytes] of packages)await writeFile(resolve(root,'dashboard/dist',name),bytes);
           const rows=[];
           for(const dest of destinations)for(const [name,bytes] of payload)rows.push(hash(bytes)+'  '+dest+'/'+name);
           for(const [name,bytes] of packages)rows.push(hash(bytes)+'  dashboard/dist/'+name);
           await writeFile(resolve(root,'SHA256SUMS_FRONTEND.txt'),rows.sort().join('\n')+'\n');
           console.log('Built V4.07.57 frontend as a version-marker-only patch over the protected V4.07.56 runtime baseline.');
           for(const [name,bytes] of packages)console.log(`Dashboard package ${name}: ${bytes.length} bytes, SHA256 ${hash(bytes)}`);
           console.log('Protected diagnostic/assets baseline preserved; V4.06 fallback package retained and V4.07 package built deterministically.');
          }
          if(process.argv[1]&&resolve(process.argv[1])===fileURLToPath(import.meta.url))await build();
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-frontend.mjs')
          s=p.read_text(encoding='utf-8')
          old="PASS: accepted V4.07.56 source baseline, exact delivery parity, 16 referenced assets, 1 retained legacy asset, V4.06 fallback package and canonical V4.07 package parity/checksums."
          new="PASS: V4.07.57 version-marker patch validated against the protected V4.07.56 runtime baseline; exact delivery parity, assets and packages verified."
          if s.count(old)!=1: raise SystemExit('verify-frontend status anchor changed')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY

      - name: Add V4.07.57 About golden wrapper
        run: |
          set -euo pipefail
          cp scripts/verify-about-golden-v40756.cjs scripts/verify-about-golden-v40757.cjs
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-about-golden-v40757.cjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const out = path.join(root, 'artwork/acceptance/premium-controls/golden-v40756');", "const out = path.join(root, 'artwork/acceptance/premium-controls/golden-v40757');")
          old="""const frontend = fs.readFileSync(path.join(root, 'frontend/gewitterradar.js'));
          const frontendSha = crypto.createHash('sha256').update(frontend).digest('hex');
          assert.equal(
            frontendSha,
            contract.acceptedFrontend.sha256,
            'About golden contract is only valid for the exact accepted V4.07.56 frontend baseline',
          );"""
          new="""const frontend = fs.readFileSync(path.join(root, 'frontend/gewitterradar.js'));
          const frontendText = frontend.toString('utf8');
          assert.ok(frontendText.includes(\"const CARD_VERSION = '4.07.57';\"), 'Expected V4.07.57 CARD_VERSION');
          assert.ok(frontendText.includes(\"const CARD_DISPLAY_VERSION = '4.07.57';\"), 'Expected V4.07.57 CARD_DISPLAY_VERSION');
          const normalizedFrontend = Buffer.from(frontendText
            .replace('Gewitterradar Card V4.07.57', 'Gewitterradar Card V4.07.56')
            .replace(\"const CARD_VERSION = '4.07.57';\", \"const CARD_VERSION = '4.07.56';\")
            .replace(\"const CARD_DISPLAY_VERSION = '4.07.57';\", \"const CARD_DISPLAY_VERSION = '4.07.56';\"), 'utf8');
          const frontendSha = crypto.createHash('sha256').update(normalizedFrontend).digest('hex');
          assert.equal(
            frontendSha,
            contract.acceptedFrontend.sha256,
            'V4.07.57 About source must differ from the accepted V4.07.56 baseline only by version markers',
          );"""
          if old not in s: raise SystemExit('Golden verifier identity block changed')
          s=s.replace(old,new)
          s=s.replace('V4.07.56 About golden geometry PASS', 'V4.07.57 About geometry PASS against protected V4.07.56 baseline')
          s=s.replace('PASS: accepted V4.07.56 About golden geometry and same-run delivery pixel contract verified.', 'PASS: V4.07.57 About geometry matches the protected V4.07.56 baseline and same-run delivery pixel contract.')
          p.write_text(s,encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/shared-frontend.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Canonical V4.07.56 frontend contract','Canonical V4.07.57 frontend contract')
          s=s.replace('replayed against V4.07.56 because the user-accepted V4.07.56 source is now\n      # the exact canonical baseline.','replayed against V4.07.57 because V4.07.57 is a version-marker-only patch\n      # over the exact protected V4.07.56 runtime baseline.')
          s=s.replace('V4.07.56 Settings and Help profiles','V4.07.57 Settings and Help profiles')
          s=s.replace('Accepted V4.07.56 About golden contract','V4.07.57 About geometry against protected V4.07.56 golden contract')
          s=s.replace('node scripts/verify-about-golden-v40756.cjs', 'node scripts/verify-about-golden-v40757.cjs')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Bump native integration patch version
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('custom_components/gewitterradar/manifest.json'),
              Path('scripts/verify-hacs-integration-package.py'),
              Path('tests/test_manifest.py'),
          ]
          for p in files:
              s=p.read_text(encoding='utf-8')
              if '0.19.0' not in s: raise SystemExit(f'Expected 0.19.0 anchor missing in {p}')
              p.write_text(s.replace('0.19.0','0.19.1'),encoding='utf-8')
          PY

      - name: Rebuild and verify deterministic deliveries
        run: |
          set -euo pipefail
          node scripts/build-frontend.mjs
          node scripts/verify-frontend.mjs
          node scripts/verify-diagnostic-contract.mjs
          node --check frontend/gewitterradar.js
          cmp -s frontend/gewitterradar.js custom_components/gewitterradar/frontend/gewitterradar.js
          cmp -s frontend/gewitterradar.js dashboard/dist/gewitterradar.js

      - name: Commit prepared V4.07.57 payload
        run: |
          set -euo pipefail
          rm -f .github/workflows/audit-v4.07.57.yml .github/workflows/prepare-v4.07.57.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare V4.07.57 version and runtime metadata'
          git push origin HEAD:release/v4.07.57
