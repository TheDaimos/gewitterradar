name: Fix V4.09 medallion diagnostic selector
on:
  push:
    branches:
      - release/v4.09
    paths:
      - '.github/workflows/fix-v409-diagnostic-selector.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scope medallion diagnostics to trend instrument
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          src=Path('frontend/gewitterradar.js')
          s=src.read_text(encoding='utf-8')
          old="image=this.shadow?.querySelector('.trend-medallion-base'),arrow=this.shadow?.querySelector('.trend-medallion-arrow')"
          new="image=icon?.querySelector('.trend-medallion-base'),arrow=icon?.querySelector('.trend-medallion-arrow')"
          if s.count(old)!=1:
              raise SystemExit(f'unexpected diagnostic selector count: {s.count(old)}')
          s=s.replace(old,new,1)
          src.write_text(s,encoding='utf-8',newline='')
          final=src.read_bytes()
          final_sha=hashlib.sha256(final).hexdigest()
          final_size=len(final)

          # Keep all delivery forms byte-identical.
          for path in [
              'custom_components/gewitterradar/frontend/gewitterradar.js',
              'dashboard/dist/gewitterradar.js',
          ]:
              Path(path).write_bytes(final)

          # Extend deterministic provenance: reversing this one diagnostic selector
          # plus release metadata must reconstruct the accepted V4.09.28 candidate.
          p=Path('scripts/build-frontend.mjs')
          b=p.read_text(encoding='utf-8')
          marker=".replace(\"const GEWITTERRADAR_BUILD = 'V4.09-RELEASE-2026-09-21';\",\"const GEWITTERRADAR_BUILD = 'V4.09.28-DEV-2026-09-21';\");"
          repl=".replace(\"const GEWITTERRADAR_BUILD = 'V4.09-RELEASE-2026-09-21';\",\"const GEWITTERRADAR_BUILD = 'V4.09.28-DEV-2026-09-21';\")\n .replace(\"image=icon?.querySelector('.trend-medallion-base'),arrow=icon?.querySelector('.trend-medallion-arrow')\",\"image=this.shadow?.querySelector('.trend-medallion-base'),arrow=this.shadow?.querySelector('.trend-medallion-arrow')\");"
          if marker not in b:
              raise SystemExit('builder normalization marker missing')
          b=b.replace(marker,repl,1)
          b=b.replace('changes beyond approved V4.09.26 release metadata','changes beyond approved V4.09.28 release metadata plus diagnostic selector scope')
          b=b.replace('changes beyond approved V4.09.28 release metadata','changes beyond approved V4.09.28 release metadata plus diagnostic selector scope')
          b=b.replace('release-metadata-only normalization','release-metadata normalization plus diagnostic selector scope correction')
          p.write_text(b,encoding='utf-8',newline='')

          p=Path('tests/contracts/frontend-release-v4.09.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['sha256']=final_sha
          d['sizeBytes']=final_size
          d['allowedCandidateDelta']='public version/display/build markers plus medallion diagnostic selector scoped to the production trend instrument'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          p=Path('docs/archive-triggers/V4_09_PUBLISH.trigger')
          t=p.read_text(encoding='utf-8').splitlines()
          t=[f'FRONTEND_SHA256={final_sha}' if x.startswith('FRONTEND_SHA256=') else f'FRONTEND_SIZE={final_size}' if x.startswith('FRONTEND_SIZE=') else x for x in t]
          p.write_text('\n'.join(t)+'\n',encoding='utf-8')

          p=Path('scripts/verify-frontend.mjs')
          v=p.read_text(encoding='utf-8').replace('V4.09 final validated against accepted V4.09.26 provenance','V4.09 final validated against accepted V4.09.28 provenance plus diagnostic selector scope correction')
          p.write_text(v,encoding='utf-8',newline='')

          print(f'FINAL_SHA256={final_sha}')
          print(f'FINAL_SIZE={final_size}')
          PY

      - name: Rebuild checksum inventory and verify contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-frontend.mjs
          node scripts/verify-frontend.mjs
          node scripts/verify-diagnostic-contract.mjs
          node scripts/verify-hires-asset-retention.mjs
          node scripts/verify-source-archive-contract.mjs
          python scripts/verify-hacs-integration-package.py
          node --check frontend/gewitterradar.js

      - name: Commit release-blocking diagnostic correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: scope V4.09 medallion diagnostics to trend instrument'
          git push origin HEAD:release/v4.09
