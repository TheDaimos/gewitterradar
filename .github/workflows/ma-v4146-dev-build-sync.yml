name: Build V4.14.6 MA opt-in and migration DEV mirrors
# Superseded by V4.14.7 build; historical V4.14.6 runner is manual only.
on:
  workflow_dispatch:

concurrency:
  group: ma-4146-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ma-dev:
    if: github.repository == 'TheDaimos/gewitterradar' && github.ref == 'refs/heads/feature/v4.14-monitored-areas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm exact authorized DEV identity and new module
        run: |
          grep -q 'version:"4.14.6"' frontend/version.js
          grep -q 'BUILD_VERSION = "4.14.6"' custom_components/gewitterradar/build_info.py
          test -f frontend/modules/monitored-areas/location-manager.js
      - name: Update runtime asset SHA and size from actual versioned source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const path='frontend/assets.json';
          const list=JSON.parse(fs.readFileSync(path,'utf8'));
          const asset=list.find(x=>x.file==='assets/gewitterradar-runtime-manifest.json');
          if(!asset)throw Error('Missing canonical runtime asset inventory entry');
          const bytes=fs.readFileSync('frontend/'+asset.file);
          asset.sha256=createHash('sha256').update(bytes).digest('hex');
          asset.sizeBytes=bytes.length;
          fs.writeFileSync(path,JSON.stringify(list,null,2)+'\n');
          JS
      - name: Build canonical frontend into both mirrors, dashboard and hashes
        run: node scripts/build-frontend.mjs
      - name: Validate MA-004 lifecycle, registration and MA-023 management
        run: |
          node --test scripts/test-ma-004.mjs
          node tests/test_ma_location_manager.mjs
          python -m unittest discover -s tests -p 'test_ma_frontend_module_registration.py' -v
          python -m unittest discover -s tests -p 'test_ma_v4146_optin_contract.py' -v
          python scripts/test-ma-018.py
          python scripts/test-ma-020-finalization.py
      - name: Ensure no protected source module changed by build
        run: |
          if ! git diff --quiet -- frontend/gewitterradar.js frontend/modules frontend/version.js frontend/module-manifest.js; then
            echo "ERROR: canonical frontend source was modified by build"
            exit 1
          fi
      - name: Commit only regenerated delivery files on DEV branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- frontend/assets.json dashboard/dist custom_components/gewitterradar/frontend SHA256SUMS_FRONTEND.txt
          if git diff --cached --quiet; then
            echo "Delivery files already synchronized"
          else
            git commit -m "build(gr): regenerate V4.14.6 SQLite opt-in and migration UI mirrors and SHA256"
            git push origin HEAD:feature/v4.14-monitored-areas
          fi
