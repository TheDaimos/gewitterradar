name: V4.08.05 Session Control Polish Test Package

on:
  push:
    branches:
      - feature/v4.08-cluster-zoom-and-cleanup
    paths:
      - 'scripts/build-v40801-cluster-test.mjs'
      - 'scripts/build-v40802-diagnostic-weather-lab.mjs'
      - 'scripts/run-v40802-diagnostic-weather-lab.mjs'
      - 'scripts/build-v40802-diagnostic-weather-lab-pass2.mjs'
      - 'scripts/build-v40803-storm-radius-fix.mjs'
      - 'scripts/build-v40804-cluster-session-countdown.py'
      - 'scripts/build-v40805-session-control-polish.py'
      - 'docs/V4_08_DIAGNOSTIC_WEATHER_LAB.md'
      - 'docs/V4_08_CLUSTER_SESSION_COUNTDOWN_TEST.md'
      - 'docs/V4_08_SESSION_CONTROL_POLISH_TEST.md'
      - '.github/workflows/v40805-test-package.yml'
      - 'frontend/**'
      - 'custom_components/gewitterradar/**'
      - 'dashboard/dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4.08 branch
        uses: actions/checkout@v4

      - name: Build deterministic V4.08.05 frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          {
            node scripts/build-v40803-storm-radius-fix.mjs
            python scripts/build-v40804-cluster-session-countdown.py
            python scripts/build-v40805-session-control-polish.py
          } 2>&1 | tee build/v40805-build.log

      - name: Upload V4.08.05 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_V4.08.05_BUILD_LOG
          path: build/v40805-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated frontend and UI guards
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/gewitterradar.js
          cmp -s frontend/gewitterradar.js custom_components/gewitterradar/frontend/gewitterradar.js
          cmp -s frontend/gewitterradar.js dashboard/dist/gewitterradar.js
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('frontend/gewitterradar.js')
          s=p.read_text(encoding='utf-8')
          assert "const CARD_VERSION = '4.08.05';" in s
          assert "V4.08.05-SESSION-CONTROL-POLISH-2026-09-17" in s
          assert 'settings-cluster-session-selector' in s
          assert 'settings-cluster-session-infinity-glyph' in s
          assert "label += ' ∞';" in s
          assert "label += ` · ${Math.ceil(remainingMs / 1000)}s`;" in s
          assert 'transform:scale(1.25);transform-origin:center;' in s
          assert 'max-height:clamp(230px,calc(100dvh - 490px),560px)!important' in s
          assert s.rindex('max-height:clamp(230px,calc(100dvh - 490px),560px)!important') > s.rindex('max-height:none')
          assert 'width:55px;height:24px;min-height:24px' in s
          decl=s.index('const stormRadius = this._currentStormRadius ?? Math.min(this._stormRadiusValue(),observationRadius);')
          use=s.index('const inStorm = s.distance != null && s.distance <= stormRadius;')
          assert decl < use
          print('Frontend SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('V4.08.05 UI guards OK')
          PY

      - name: Create installable V4.08.05 test ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/v40805
          mkdir -p build/v40805/native/custom_components build/v40805/dashboard
          cp -a custom_components/gewitterradar build/v40805/native/custom_components/
          cp -a dashboard/dist/. build/v40805/dashboard/
          mv build/v40805/dashboard/gewitterradar.js build/v40805/dashboard/gewitterradar-v4.08.05.js
          test -f build/v40805/dashboard/gewitterradar-v4.08.05.js
          test ! -e build/v40805/dashboard/gewitterradar.js
          cmp -s frontend/gewitterradar.js build/v40805/dashboard/gewitterradar-v4.08.05.js
          cp docs/V4_08_DIAGNOSTIC_WEATHER_LAB.md build/v40805/V4_08_DIAGNOSTIC_WEATHER_LAB.md
          cp docs/V4_08_CLUSTER_SESSION_COUNTDOWN_TEST.md build/v40805/V4_08_CLUSTER_SESSION_COUNTDOWN_TEST.md
          cp docs/V4_08_SESSION_CONTROL_POLISH_TEST.md build/v40805/V4_08_SESSION_CONTROL_POLISH_TEST.md
          cat > build/v40805/README_V4.08.05_TEST.txt <<'TXT'
          Gewitterradar V4.08.05 TEST
          ===========================

          Basis:
          - V4.08.04 Cluster-Sprung-Sitzungszeit und Countdown
          - V4.08.03 stormRadius-Laufzeitkorrektur
          - unveränderte V4.08 Diagnose-/Cluster-Testlogik

          Neu in V4.08.05:
          - Sitzungszeit-Bedienung im Stil der Ortssuche als gemeinsame Auswahl
          - kompakteres Sekundenfeld
          - ∞ zunächst weiterhin als Unicode-Platzhalter, noch keine Hi-Res-Grafik
          - endliche Kartenanzeige: "Cluster x/N · 390s"
          - unbegrenzte Kartenanzeige: "Cluster x/N ∞" ohne Mittelpunkt
          - Radien-Akkordeon scrollt intern, wenn die Fensterhöhe es erfordert
          - Lat/Lon-Ziel-/Dartscheiben-Symbol exakt 25 Prozent größer dargestellt

          Dashboard-/Dev-Test:
          Datei:
            dashboard/gewitterradar-v4.08.05.js

          Ziel:
            /config/www/community/gewitterradar-dashboard/gewitterradar-v4.08.05.js

          Ressource:
            /hacsfiles/gewitterradar-dashboard/gewitterradar-v4.08.05.js?v=40805

          Ressourcentyp:
            JavaScript-Modul

          View:
            title: Gewitterradar
            path: gewitterradar
            icon: mdi:weather-lightning
            type: panel
            cards:
              - type: custom:gewitterradar-card

          Package:
          app_gewitterradar_v4_07_pkg.yaml bleibt unverändert verwendbar.
          TXT
          (
            cd build/v40805
            zip -qr ../Gewitterradar_V4.08.05_TEST.zip .
          )
          unzip -t build/Gewitterradar_V4.08.05_TEST.zip
          sha256sum build/Gewitterradar_V4.08.05_TEST.zip | tee build/Gewitterradar_V4.08.05_TEST.sha256
          sha256sum frontend/gewitterradar.js | tee build/gewitterradar-v40805-frontend.sha256
          sha256sum dashboard/dist/app_gewitterradar_v4_07_pkg.yaml | tee build/app_gewitterradar_v4_07_pkg.sha256
          test "$(cut -d' ' -f1 build/app_gewitterradar_v4_07_pkg.sha256)" = "1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694"

      - name: Upload V4.08.05 test package
        uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_V4.08.05_TEST
          path: |
            build/Gewitterradar_V4.08.05_TEST.zip
            build/Gewitterradar_V4.08.05_TEST.sha256
            build/gewitterradar-v40805-frontend.sha256
            build/app_gewitterradar_v4_07_pkg.sha256
          if-no-files-found: error
          retention-days: 30
