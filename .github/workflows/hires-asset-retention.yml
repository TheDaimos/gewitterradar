name: Hi-Res asset retention

on:
  pull_request:
  push:
    branches:
      - main
      - 'freeze/**'
      - 'frozen/**'
      - 'feature/**'
      - 'finalize/**'

permissions:
  contents: read

jobs:
  verify-hires-asset-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify permanent Hi-Res master retention contract
        run: node scripts/verify-hires-asset-retention.mjs
