name: Hi-Res asset retention

on:
  pull_request:
    paths:
      - 'artwork/**'
      - 'scripts/verify-hires-asset-retention.mjs'
      - 'tests/contracts/hires-asset-retention-v4.07.56.json'
      - 'docs/ASSET_RETENTION_POLICY.md'
      - 'PROJECT_DEFAULTS.md'
      - 'docs/RELEASE_PROCESS.md'
      - '.github/workflows/hires-asset-retention.yml'
  push:
    branches:
      - main
      - 'freeze/**'
      - 'frozen/**'
      - 'feature/**'
      - 'finalize/**'
    paths:
      - 'artwork/**'
      - 'scripts/verify-hires-asset-retention.mjs'
      - 'tests/contracts/hires-asset-retention-v4.07.56.json'
      - 'docs/ASSET_RETENTION_POLICY.md'
      - 'PROJECT_DEFAULTS.md'
      - 'docs/RELEASE_PROCESS.md'
      - '.github/workflows/hires-asset-retention.yml'

permissions:
  contents: read

jobs:
  verify-hires-asset-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify permanent Hi-Res master retention contract
        run: node scripts/verify-hires-asset-retention.mjs
