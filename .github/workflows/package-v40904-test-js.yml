name: Package V4.09.04 test JS

on:
  push:
    branches:
      - feature/v4.09.04-overlay-drag-fixes
    paths:
      - ".github/workflows/package-v40904-test-js.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Package canonical V4.09.04 frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp frontend/gewitterradar.js artifact/gewitterradar-v4.09.04.js
          cd artifact
          zip -9 Gewitterradar_V4.09.04_TEST_JS.zip gewitterradar-v4.09.04.js
          sha256sum Gewitterradar_V4.09.04_TEST_JS.zip > Gewitterradar_V4.09.04_TEST_JS.zip.sha256
      - name: Upload V4.09.04 test package
        uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_V4.09.04_TEST_JS
          path: |
            artifact/Gewitterradar_V4.09.04_TEST_JS.zip
            artifact/Gewitterradar_V4.09.04_TEST_JS.zip.sha256
          if-no-files-found: error
          retention-days: 7
