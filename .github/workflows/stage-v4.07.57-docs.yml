name: Stage Gewitterradar V4.07.57 documentation

on:
  push:
    branches:
      - release/v4.07.57
    paths:
      - '.github/workflows/stage-v4.07.57-docs.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize V4.07.57 documentation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          NEW_SHA='ac921b5fc40f2d7f36733bb7262fdb1595790674695ad0eb83ccde8bc7146571'
          OLD_SHA='249485f4bcf68c9b23b821cae9b507030ae09cff5a56f7e28d3d7f3b02eb4a1a'

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected one {old!r}, found {count}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # README: public product status and canonical V4.07.57 identity.
          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('![Version](https://img.shields.io/badge/Gewitterradar-V4.07.56-c9a45b)','![Version](https://img.shields.io/badge/Gewitterradar-V4.07.57-c9a45b)'),
            ('![Integration](https://img.shields.io/badge/Integration-0.19.0-c9a45b)','![Integration](https://img.shields.io/badge/Integration-0.19.1-c9a45b)'),
            ('<tr><td><strong>Release Notes</strong></td><td><a href="docs/RELEASE_NOTES_V4_07_56.md">docs/RELEASE_NOTES_V4_07_56.md</a></td></tr>','<tr><td><strong>Release Notes</strong></td><td><a href="docs/RELEASE_NOTES_V4_07_57.md">docs/RELEASE_NOTES_V4_07_57.md</a></td></tr>'),
            ('Aktueller abgenommener Produktkandidat: **2026/09 · V4.07.56**  ','Aktueller öffentlicher Produktstand: **2026/09 · V4.07.57**  '),
            ('Native Integration: **0.19.0**  ','Native Integration: **0.19.1**  '),
            ('Öffentliche Rückfallbasis bis zur kontrollierten Promotion: **2026/09 · V4.06**','Geschützte Laufzeitbasis: **2026/09 · V4.07.56**'),
            ('Kanonische V4.07.56-Frontendidentität:','Kanonische V4.07.57-Frontendidentität:'),
            ('Größe:  1.955.141 Bytes\nSHA256: '+OLD_SHA,'Größe:  1.955.144 Bytes\nSHA256: '+NEW_SHA+'\n\nLaufzeitschutz: Nach Rücknormalisierung der vier Versions-/Build-Metadatenanker ist der Frontendinhalt exakt identisch mit der geschützten V4.07.56-Basis (`'+OLD_SHA+'`).'),
          ]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'README anchor count {s.count(old)} for {old!r}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Installation guide: make V4.07.57 the visible/current release.
          p=Path('docs/INSTALLATION.md'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('# Gewitterradar V4.07.56 – Installation','# Gewitterradar V4.07.57 – Installation'),
            ('Aktueller abgenommener Produktkandidat: **V4.07.56**  \nNative Integration: **0.19.0**','Aktueller öffentlicher Produktstand: **V4.07.57**  \nNative Integration: **0.19.1**  \nGeschützte Laufzeitbasis: **V4.07.56**'),
            ('Kanonische V4.07.56-Frontendidentität:','Kanonische V4.07.57-Frontendidentität:'),
            ('Größe:  1.955.141 Bytes\nSHA256: '+OLD_SHA,'Größe:  1.955.144 Bytes\nSHA256: '+NEW_SHA),
            ('- Gewitterradar zeigt **V4.07.56**;','- Gewitterradar zeigt **V4.07.57**;'),
            ('- [`RELEASE_NOTES_V4_07_56.md`](RELEASE_NOTES_V4_07_56.md) – V4.07.56-Abschlussstand','- [`RELEASE_NOTES_V4_07_57.md`](RELEASE_NOTES_V4_07_57.md) – V4.07.57-Dokumentations-/Installations-Patch\n- [`RELEASE_NOTES_V4_07_56.md`](RELEASE_NOTES_V4_07_56.md) – geschützte V4.07.56-Laufzeitbasis'),
          ]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'INSTALLATION anchor count {s.count(old)} for {old!r}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Changelog: new public patch section, retain V4.07.56 as historical baseline.
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          insert="""## 2026/09 — V4.07.57 / native integration 0.19.1

### Documentation and installation

- Rework the canonical README into a visually structured, integration-first installation guide with logo, badges, clear navigation, callouts and troubleshooting.
- Put the native HACS installation path first and document the required `/gewitterradar/gewitterradar.js` JavaScript module prominently.
- Add the complete copy-ready native Dashboard View including `vertical-stack`, Blitzortung counter, native radius entity and native compass-mode entity.
- Clarify the difference between a complete View, a whole-dashboard `views:` block and the content of a Manual card.
- Document the Gewitterradar reference tracker, Blitzortung `Location entity` coupling and Recorder protection in the main entry documentation.
- Mirror the same readable installation structure in `TheDaimos/gewitterradar-dashboard`, adapted to HACS Dashboard delivery and the V4.07 helper package.

### Release integrity

- Product version: **V4.07.57**.
- Native Integration: **0.19.1**.
- Build metadata: `V4.07-RELEASE57-2026-09-16`.
- Frontend: **1.955.144 Bytes**, SHA256 `"""+NEW_SHA+"""`.
- Runtime logic remains the protected V4.07.56 baseline. After normalizing only the version/build metadata markers, the frontend reproduces the exact V4.07.56 SHA256 `"""+OLD_SHA+"""`.
- V4.07 Dashboard package remains unchanged with SHA256 `1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694`.

"""
          marker='# Changelog\n\n'
          if not s.startswith(marker): raise SystemExit('CHANGELOG header changed')
          s=marker+insert+s[len(marker):]
          stale='> **Noch nicht öffentlich veröffentlicht.** V4.07.56 ist der vom Benutzer abgenommene gemeinsame Produkt-/Diagnosestand. Die kontrollierte Promotion nach `main`, der post-merge Golden Master sowie der öffentliche Tag/HACS-/GitHub-Release stehen noch aus. V4.06 bleibt bis dahin die öffentliche Rückfallbasis.'
          historical='> **Historischer Abschlussstand.** V4.07.56 wurde am 16.09.2026 veröffentlicht und bildet die geschützte Laufzeit-/Diagnosebasis für V4.07.57.'
          if s.count(stale)!=1: raise SystemExit('V4.07.56 changelog status anchor changed')
          s=s.replace(stale,historical,1)
          p.write_text(s,encoding='utf-8')

          # Project defaults: replace the obsolete promotion block with current public status.
          p=Path('PROJECT_DEFAULTS.md'); s=p.read_text(encoding='utf-8')
          start=s.find('## Aktueller Release-/Promotionsstand')
          end=s.find('Verbindliche Dokumente:',start)
          if start<0 or end<0: raise SystemExit('PROJECT_DEFAULTS release block not found')
          block="""## Aktueller Release-/Promotionsstand

Aktueller öffentlicher Produktstand ist **2026/09 · V4.07.57 / native Integration 0.19.1**.

V4.07.57 ist ein Dokumentations-/Installations-Patch auf der geschützten V4.07.56-Laufzeit- und Diagnosebasis. Die Produktlogik bleibt unverändert; im Frontend unterscheiden sich ausschließlich Versions- und Build-Metadatenanker.

Kanonische V4.07.57-Identität:

- Frontend: **1.955.144 Bytes**;
- Frontend-SHA256: `"""+NEW_SHA+"""`;
- geschützte V4.07.56-Basis-SHA256 nach Metadaten-Normalisierung: `"""+OLD_SHA+"""`;
- Locale-SHA256: `997c4fe9b357935888fdb7bedc43cdd17f105b97241a000324891cea575dd436`;
- Dashboard-Paket: `app_gewitterradar_v4_07_pkg.yaml`;
- Dashboard-Paket-SHA256: `1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694`.

Die V4.07.56-Tags, Freeze-Punkte und Schutzverträge bleiben unverändert historische Referenzen. V4.07.57 erhält einen eigenen Tag und einen eigenen eingefrorenen Release-Punkt.

"""
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')

          # Milestones: current status plus a dedicated documentation/release milestone.
          p=Path('docs/MILESTONES.md'); s=p.read_text(encoding='utf-8')
          old="""Status: **2026/09 · V4.07.56 – abgenommener Produkt-/Diagnosekandidat.**  
Native Integration: **0.19.0.**  
Öffentliche Rückfallbasis bis zur kontrollierten Promotion: **V4.06.**  
`main` bleibt bis zur ausdrücklichen Benutzerfreigabe unverändert."""
          new="""Status: **2026/09 · V4.07.57 – öffentlicher Dokumentations-/Installations-Patch.**  
Native Integration: **0.19.1.**  
Geschützte Laufzeit-/Diagnosebasis: **V4.07.56.**"""
          if s.count(old)!=1: raise SystemExit('MILESTONES status anchor changed')
          s=s.replace(old,new,1)
          marker='## Erreicht\n\n'
          milestone="""### M20 – V4.07.57 verständliche öffentliche Installation
- kanonische README visuell neu strukturiert und native Integration an erste Stelle gesetzt;
- vollständigen kopierfertigen View-Block inklusive `vertical-stack` und nativer Entity-IDs prominent dokumentiert;
- Ressourcenregistrierung, Blitzortung-Kopplung, Recorder-Schutz und Fehlersuche direkt auffindbar gemacht;
- Dashboard-/Package-README im gleichen Stil gespiegelt;
- Laufzeit gegenüber V4.07.56 durch einen Metadaten-only-Vertrag geschützt.

"""
          if s.count(marker)!=1: raise SystemExit('MILESTONES reached marker changed')
          s=s.replace(marker,marker+milestone,1)
          p.write_text(s,encoding='utf-8')

          # History: public V4.07.57 entry without rewriting older milestones.
          p=Path('docs/HISTORY.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('Die erste stabile V4.00 und die darauf folgenden öffentlichen V4.01 bis V4.06 gehören zur Release-Phase `2026/09`.','Die erste stabile V4.00 und die darauf folgenden öffentlichen V4-Releases bis einschließlich V4.07.57 gehören zur Release-Phase `2026/09`.',1)
          marker='Seit V4.06 ist die Monatskennung Teil des verbindlichen Releaseformats: Der aktuelle Stand wird als `YYYY/MM · Vx.xx` dargestellt, historische Einträge als `Vx.xx · YYYY/MM`. Der vollständige Ablauf ist in `docs/RELEASE_PROCESS.md` festgeschrieben.\n\n'
          entry="""## V4.07.57 · 2026/09 – öffentliche Installation verständlich gemacht

V4.07.57 ist ein gezielter Dokumentations- und Installations-Patch auf der geschützten V4.07.56-Laufzeitbasis. Die Haupt-README wurde zu einer visuell gegliederten Produkt- und Installationsseite umgebaut. Die native Integration steht nun an erster Stelle; HACS-Installation, Ressourcenregistrierung und der vollständige Gewitterradar-View sind ohne Suche direkt kopierbar.

Parallel wurde die README der Dashboard-/Package-Auslieferung im gleichen Stil aufgebaut. Die Variante erklärt ihren zusätzlichen Package-Schritt, den HACS-Ressourcenpfad und die zugehörigen `lightning_detection_*`-Helfer separat und verwechselt sie nicht mit den nativen Entitäten.

Die Produktlogik wurde für V4.07.57 nicht verändert. Die Frontendabweichung gegenüber V4.07.56 ist maschinell auf Versions- und Build-Metadaten beschränkt; nach Rücknormalisierung entsteht exakt die akzeptierte V4.07.56-Frontendidentität.

"""
          if s.count(marker)!=1: raise SystemExit('HISTORY insertion marker changed')
          s=s.replace(marker,marker+entry,1)
          p.write_text(s,encoding='utf-8')

          # Replace obsolete V4.07.56 promotion checklist with the V4.07.57 closure contract.
          Path('docs/V4_07_RELEASE_TODO.md').write_text("""# Gewitterradar V4.07.57 – Release-Abschluss

Stand: **16.09.2026**  
Produkt: **V4.07.57**  
Native Integration: **0.19.1**  
Geschützte Laufzeit-/Diagnosebasis: **V4.07.56**

V4.07.57 ist bewusst ein Dokumentations-/Installations-Patch. Die normale Karten-, Ortssuche-, Sprach-, Hilfe-, Radien-, Medaillon-, Diagnose- und Bedienlogik bleibt auf dem akzeptierten V4.07.56-Stand.

## Identität

- Frontend: **1.955.144 Bytes**
- Frontend-SHA256: `"""+NEW_SHA+"""`
- Build: `V4.07-RELEASE57-2026-09-16`
- geschützte V4.07.56-SHA256 nach Rücknormalisierung: `"""+OLD_SHA+"""`
- Dashboard-Paket-SHA256: `1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694`

## Release-Gates

- [x] V4.07.56 bleibt unverändert als historische/protected Baseline erhalten.
- [x] V4.07.57-Frontend unterscheidet sich nur in Versions-/Build-Metadatenankern.
- [x] Native Integration auf `0.19.1` angehoben.
- [x] README und Installationsdokumentation auf Integration-first umgebaut.
- [x] Vollständiger nativer View-Block dokumentiert.
- [x] Dashboard-/Package-README im gleichen Stil vorbereitet.
- [x] PRE-MERGE-Snapshot des bisherigen `main` als geprüftes GitHub-Actions-Artefakt erzeugt.
- [x] V4.07.57-Release-Notes angelegt.
- [ ] Merge nach `main`, vollständige Post-Merge-Gates, Golden-Master-Artefakt und öffentlicher Tag/Release werden durch den kontrollierten Veröffentlichungsablauf abgeschlossen.

Der öffentliche `v4.07.57`-Tag darf nur auf exakt dem Commit liegen, der nach dem Merge auf `main` die Release-Gates bestanden hat und aus dem der Golden Master erzeugt wurde.

## Externe Nachprüfungen

Reale Blitzortung-Datenregions-/Latenztests sowie besondere DNS-/Proxy-/TLS-Inspection-Szenarien bleiben getrennte Umgebungsprüfungen. Sie werden durch diesen Dokumentationspatch nicht fälschlich als erledigt markiert und verändern die bereits geschützte Produktlogik nicht.
""",encoding='utf-8')

          # Dedicated release notes.
          Path('docs/RELEASE_NOTES_V4_07_57.md').write_text("""# Gewitterradar V4.07.57 · 2026/09 – Release Notes

## Zweck dieser Version

V4.07.57 macht die öffentliche Installation von Gewitterradar deutlich leichter auffindbar und verständlicher. Der Schwerpunkt liegt auf der Dokumentation für neue Nutzer – allen voran auf der **nativen Home-Assistant-Integration**.

Die Laufzeitlogik bleibt bewusst auf dem vollständig geschützten und geprüften V4.07.56-Stand. V4.07.57 verändert im Frontend ausschließlich Versions- und Build-Metadaten.

## Neue Installationsdokumentation

Die Haupt-README wurde vollständig neu gegliedert:

- visueller Kopfbereich mit Gewitterradar-Logo und Versionskennungen;
- native Integration als erster und empfohlener Installationsweg;
- HACS-Installation Schritt für Schritt;
- klar hervorgehobene Registrierung von `/gewitterradar/gewitterradar.js` als JavaScript-Modul;
- vollständiger, direkt kopierbarer Gewitterradar-View;
- getrennte Beispiele für View, gesamten `views:`-Block und Manuelle Karte;
- verständliche Prüfung nach der Installation;
- Referenztracker und Blitzortung-`Location entity` erklärt;
- Recorder-Schutz und Fehlersuche direkt in der Einstiegsdokumentation;
- technische Entwickler-/Release-Details nachgeordnet statt vor der Installation.

Empfohlener nativer View:

```yaml
title: Gewitterradar
path: gewitterradar
icon: mdi:weather-lightning
type: panel
cards:
  - type: vertical-stack
    cards:
      - type: custom:gewitterradar-card
        counter_entity: sensor.home_lightning_counter
        radius_entity: number.gewitterradar_observation_radius
        compass_mode_entity: switch.gewitterradar_compass_nearest_strike
```

## Dashboard-/Package-Variante

Das abgeleitete Repository `TheDaimos/gewitterradar-dashboard` erhält denselben visuellen und verständlichen Aufbau, angepasst an seine eigene Installation:

- HACS-Typ **Dashboard**;
- Ressourcenpfad `/hacsfiles/gewitterradar-dashboard/gewitterradar.js`;
- manueller V4.07-Package-Schritt nach `/config/packages/`;
- vollständiger Dashboard-View mit den `lightning_detection_*`-Helfern;
- eigener Referenztracker `device_tracker.gewitterradar_dashboard`;
- Recorder-Schutz und Fehlersuche.

## Technische Release-Identität

- Gewitterradar: **V4.07.57**
- Native Integration: **0.19.1**
- Build: `V4.07-RELEASE57-2026-09-16`
- Frontend-Größe: **1.955.144 Bytes**
- Frontend-SHA256: `"""+NEW_SHA+"""`
- geschützte V4.07.56-Basis: **1.955.141 Bytes**
- V4.07.56-Basis-SHA256: `"""+OLD_SHA+"""`
- Dashboard-Paket-SHA256: `1b705c5686e6a7be6dfb36717903df551d4f9f93787c39bd12bddf00aefae694`

Der V4.07.57-Buildvertrag normalisiert ausschließlich die Versions- und Build-Metadatenanker zurück auf V4.07.56. Danach müssen Größe und SHA256 exakt der geschützten V4.07.56-Quelle entsprechen. Damit ist maschinell abgesichert, dass dieser Patch keine unbeabsichtigte Änderung der Produktlogik enthält.

## Datenquelle und Kompatibilität

Blitzortung.org bleibt unverändert die Quelle der Live-Blitzdaten. Das V4.07-Dashboard-Package bleibt bytegleich. V4.06 und V4.07-Package dürfen weiterhin nicht parallel aktiv sein, da beide dieselben `lightning_detection_*`-Helfer definieren.
""",encoding='utf-8')

          # Trigger is inert on the release branch; it becomes active only after the approved merge to main.
          Path('docs/archive-triggers/V4_07_57_PUBLISH.trigger').write_text("""VERSION=V4.07.57
PURPOSE=Publish the documentation/install UX patch after complete post-merge validation.
FRONTEND_SHA256="""+NEW_SHA+"""
FRONTEND_SIZE=1955144
NATIVE_INTEGRATION=0.19.1
PROTECTED_BASELINE=V4.07.56
""",encoding='utf-8')
          PY

      - name: Verify documentation anchors
        run: |
          set -euo pipefail
          grep -F 'Gewitterradar-V4.07.57' README.md
          grep -F 'Integration-0.19.1' README.md
          grep -F 'title: Gewitterradar' README.md
          grep -F 'type: vertical-stack' README.md
          grep -F 'number.gewitterradar_observation_radius' README.md
          grep -F '# Gewitterradar V4.07.57 – Installation' docs/INSTALLATION.md
          grep -F 'ac921b5fc40f2d7f36733bb7262fdb1595790674695ad0eb83ccde8bc7146571' README.md docs/INSTALLATION.md docs/RELEASE_NOTES_V4_07_57.md PROJECT_DEFAULTS.md docs/V4_07_RELEASE_TODO.md

      - name: Commit release documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/INSTALLATION.md CHANGELOG.md PROJECT_DEFAULTS.md docs/MILESTONES.md docs/HISTORY.md docs/V4_07_RELEASE_TODO.md docs/RELEASE_NOTES_V4_07_57.md docs/archive-triggers/V4_07_57_PUBLISH.trigger
          git commit -m 'docs: finalize V4.07.57 public release documentation'
          git push origin HEAD:release/v4.07.57
