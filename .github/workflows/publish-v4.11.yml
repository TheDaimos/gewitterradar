name: Publish GewitterRadar V4.11 FINAL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4.11.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact stable release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          grep -Fq 'version:"4.11.249"' frontend/version.js
          grep -Fq 'displayVersion:"V4.11 FINAL"' frontend/version.js
          test "$(python -c 'import json; print(json.load(open("custom_components/gewitterradar/manifest.json"))["version"])')" = '0.25.156'
      - name: Verify delivery and source contracts
        run: |
          set -euo pipefail
          node scripts/verify-frontend.mjs
          node scripts/verify-diagnostic-contract.mjs
          node scripts/verify-hires-asset-retention.mjs
          node scripts/verify-source-archive-contract.mjs
          python scripts/verify-hacs-integration-package.py
          bash -n scripts/create-source-archive.sh
      - name: Wait for exact main commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=('Validate Gewitterradar integration' 'Validate shared Gewitterradar frontend' 'Hi-Res asset retention')
          for attempt in $(seq 1 240); do
            data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            waiting=0
            for name in "${required[@]}"; do
              row="$(printf '%s' "$data" | jq -r --arg name "$name" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')"
              echo "$name -> $row"
              case "$row" in completed:success) ;; completed:*) exit 1 ;; *) waiting=1 ;; esac
            done
            if [ "$waiting" -eq 0 ]; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Build and verify exact Golden Master
        id: golden
        run: |
          set -euo pipefail
          scripts/create-source-archive.sh GOLDEN_MASTER "$GITHUB_SHA" V4.11 dist/source-archives
          (cd dist/source-archives && for checksums in *_SHA256SUMS.txt; do sha256sum -c "$checksums"; done)
          unzip -tq '${{ steps.golden.outputs.zip_path }}'
          git bundle verify '${{ steps.golden.outputs.bundle_path }}'
      - name: Preserve release recovery archive
        uses: actions/upload-artifact@v4
        with:
          name: GewitterRadar_V4.11_GOLDEN_MASTER
          path: dist/source-archives/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Publish immutable V4.11 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if gh release view v4.11 >/dev/null 2>&1; then
            git fetch origin refs/tags/v4.11:refs/tags/v4.11 --force
            test "$(git rev-list -n1 v4.11)" = "$sha"
          else
            gh release create v4.11 dist/source-archives/* \
              --target "$sha" \
              --title 'GewitterRadar V4.11 FINAL – Premium Edition' \
              --notes-file docs/RELEASE_NOTES_V4_11_FINAL.md \
              --latest
          fi
          git fetch origin refs/tags/v4.11:refs/tags/v4.11 --force
          test "$(git rev-list -n1 v4.11)" = "$sha"
          gh release view v4.11 --json tagName,isDraft,isPrerelease,url,targetCommitish
