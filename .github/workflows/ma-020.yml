name: MA-020 journal schema contracts
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths:
      - 'custom_components/gewitterradar/monitored_areas/storage/schema.py'
      - 'custom_components/gewitterradar/monitored_areas/finalization.py'
      - 'custom_components/gewitterradar/monitored_areas/api.py'
      - 'custom_components/gewitterradar/monitored_areas/runtime.py'
      - 'scripts/test-ma-020-finalization.py'
      - 'scripts/test-ma-020-ui.mjs'
      - 'scripts/test-ma-020-reminder-browser.cjs'
      - 'scripts/build-frontend.mjs'
      - 'scripts/test-v41169-data-sources.mjs'
      - 'SHA256SUMS_FRONTEND.txt'
      - 'frontend/assets.json'
      - 'frontend/assets/gewitterradar-runtime-manifest.json'
      - 'custom_components/gewitterradar/vault_schema.py'
      - 'frontend/modules/monitored-areas/**'
      - 'frontend/modules/ui/controls.js'
      - 'frontend/module-manifest.js'
      - 'dashboard/dist/modules/monitored-areas/**'
      - 'dashboard/dist/modules/ui/controls.js'
      - 'dashboard/dist/module-manifest.js'
      - 'custom_components/gewitterradar/frontend/modules/monitored-areas/**'
      - 'custom_components/gewitterradar/frontend/modules/ui/controls.js'
      - 'custom_components/gewitterradar/frontend/module-manifest.js'
      - 'scripts/test-ma-020.py'
      - '.github/workflows/ma-020.yml'
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted MA-020 T0 T1 and schema regression
        run: |
          git rev-parse HEAD
          python -m compileall -q custom_components/gewitterradar/monitored_areas
          python scripts/test-ma-020.py
          python scripts/test-ma-020-finalization.py
          python scripts/test-ma-019.py
          node --check frontend/modules/monitored-areas/index.js
          node --check frontend/modules/ui/controls.js
          node scripts/test-ma-020-ui.mjs
          node scripts/test-ma-016.mjs

  reminder-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium startup reminder and Settings Vault persistence
        run: node scripts/test-ma-020-reminder-browser.cjs
