name: MA-023 read-only tracker name contracts
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths:
      - '.github/workflows/ma-023-tracker-name.yml'
      - 'custom_components/gewitterradar/monitored_areas/tracker_names.py'
      - 'custom_components/gewitterradar/monitored_areas/api.py'
      - 'frontend/modules/monitored-areas/location-port.js'
      - 'frontend/modules/monitored-areas/location-manager.js'
      - 'frontend/modules/monitored-areas/tracker-settings.js'
      - 'frontend/modules/monitored-areas/location-overview.js'
      - 'frontend/modules/monitored-areas/location-create.js'
      - 'frontend/modules/ui/skeleton.js'
      - 'frontend/modules/ui/controls.js'
      - 'tests/test_ma023_tracker_name.py'
      - 'tests/test_ma023_tracker_name.mjs'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_ma023_tracker_name.py' -v
      - run: python -m py_compile custom_components/gewitterradar/monitored_areas/api.py custom_components/gewitterradar/monitored_areas/tracker_names.py
      - run: node --check frontend/modules/monitored-areas/location-port.js
      - run: node --check frontend/modules/monitored-areas/location-manager.js
      - run: node --check frontend/modules/ui/controls.js
      - run: node tests/test_ma023_tracker_name.mjs
