name: Prepare V4.02 generated files

on:
  push:
    branches:
      - release/v4.02-hacs-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate V4.02 sources, HACS distribution and checksums
        run: node scripts/prepare-v4-02.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gewitterradar-card-v4_02.js gewitterradar-card-v4_02.txt dist/gewitterradar.js SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Generated V4.02 files are already current."
            exit 0
          fi
          git commit -m "Generate Gewitterradar V4.02 distribution"
          git push
