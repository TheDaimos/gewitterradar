name: Publish Gewitterradar V4.07.56

on:
  push:
    branches:
      - main
    paths:
      - 'docs/archive-triggers/V4_07_56_PUBLISH.trigger'

permissions:
  contents: write

jobs:
  publish-v4-07-56:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release infrastructure
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact accepted V4.07.56 commit and freeze
        run: |
          set -euo pipefail
          expected='6418fd57790efdbb267cc2994f00bb995f40acfd'
          git fetch origin '+refs/heads/frozen/v4.07.56:refs/remotes/origin/frozen/v4.07.56' --force
          test "$(git rev-parse refs/remotes/origin/frozen/v4.07.56^{commit})" = "$expected"
          git merge-base --is-ancestor "$expected" "$GITHUB_SHA"

      - name: Publish V4.07.56
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='6418fd57790efdbb267cc2994f00bb995f40acfd'
          if gh release view v4.07.56 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force origin refs/tags/v4.07.56:refs/tags/v4.07.56
            test "$(git rev-parse refs/tags/v4.07.56^{commit})" = "$expected"
            exit 0
          fi
          notes=$'Finaler, vollständig geprüfter V4.07.56-Release.\n\nHighlights: weltweite Orts-/PLZ-Suche und Koordinateneingabe; 19 Sprachvarianten; abgenommene Diagnosewerkzeuge; deterministischer gemeinsamer Frontend-Build; Hi-Res-/Legacy-Schutz; HACS/Hassfest/Home Assistant 2026.9.0 geprüft.\n\nProduktversion: V4.07.56\nNative Integration: 0.19.0\nRelease-Commit: 6418fd57790efdbb267cc2994f00bb995f40acfd\nFrontend SHA256: 249485f4bcf68c9b23b821cae9b507030ae09cff5a56f7e28d3d7f3b02eb4a1a'
          gh release create v4.07.56 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$expected" \
            --title 'Gewitterradar V4.07.56' \
            --notes "$notes" \
            --latest

      - name: Verify release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='6418fd57790efdbb267cc2994f00bb995f40acfd'
          git fetch --force origin refs/tags/v4.07.56:refs/tags/v4.07.56
          test "$(git rev-parse refs/tags/v4.07.56^{commit})" = "$expected"
          gh release view v4.07.56 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq 'select(.isDraft == false and .isPrerelease == false and .tagName == "v4.07.56")' >/dev/null
