name: V4.11.39 centered double tap and gesture safety
on:
  push:
    branches: [feature/v4.11-development, deploy/dev]
    paths:
      - 'frontend/**'
      - 'dashboard/dist/**'
      - 'custom_components/gewitterradar/frontend/**'
      - 'custom_components/gewitterradar/build_info.py'
      - 'custom_components/gewitterradar/dra-deployment-provenance.json'
      - 'scripts/test-v41139-mobile-map.mjs'
      - '.github/workflows/v41139-mobile-map.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  centered-doubletap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate geographic center, Android touch fallback and mirrors
        run: node scripts/test-v41139-mobile-map.mjs
