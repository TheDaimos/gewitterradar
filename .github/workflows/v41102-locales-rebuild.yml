name: Rebuild V4.11.02 localized module view

on:
  push:
    branches:
      - feature/v4.11-development
    paths:
      - .github/v41102-locales-rebuild.trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.11-development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rebuild shared frontend mirrors
        run: |
          set -euo pipefail
          node scripts/build-frontend.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/gewitterradar/frontend dashboard/dist SHA256SUMS_FRONTEND.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(v4.11.02): rebuild localized module view"
          git push origin HEAD:feature/v4.11-development
