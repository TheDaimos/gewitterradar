name: MA V9 consolidated regression gate
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths:
      - '.github/workflows/ma-v9-consolidated-regression.yml'
      - 'custom_components/gewitterradar/monitored_areas/**'
      - 'scripts/test-ma-*.py'
      - 'tests/test_ma_*.py'
      - 'scripts/build-frontend.mjs'
      - 'frontend/modules/monitored-areas/**'
      - 'docs/GR_4147_DEV_TEST_CANDIDATE_2026-11-26.md'
      - 'docs/GR_4148_MA_ANDROID_UUID_HOTFIX_2026-11-27.md'
      - 'frontend/version.js'
      - 'tests/test_ma_sqlite_preview.mjs'
      - '.github/workflows/ma-v41410-dev-build-sync.yml'
      - 'frontend/panel.js'
      - 'scripts/test-gr-panel-cache-recovery.mjs'
      - 'docs/GR_4149_PANEL_CACHE_RECOVERY_2026-11-27.md'
      - 'docs/GR_41410_MA020_SQLITE_READ_ONLY_PREVIEW_2026-11-27.md'
      - '.github/workflows/ma-v41410-dev-build-sync.yml'
      - 'frontend/assets.json'
      - 'dashboard/dist/**'
      - 'custom_components/gewitterradar/frontend/**'
      - 'SHA256SUMS_FRONTEND.txt'
      - 'custom_components/gewitterradar/dra-deployment-provenance.json'
permissions:
  contents: read
jobs:
  sqlite-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current SHA and Python syntax
        run: |
          git rev-parse HEAD
          python -m compileall -q custom_components/gewitterradar/monitored_areas
      - name: Every MA targeted contract, same commit
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/test-ma-006.py \
            scripts/test-ma-007.py \
            scripts/test-ma-008.py \
            scripts/test-ma-009.py \
            scripts/test-ma-010.py \
            scripts/test-ma-011.py \
            scripts/test-ma-012.py \
            scripts/test-ma-013.py \
            scripts/test-ma-014.py \
            scripts/test-ma-015.py \
            scripts/test-ma-016.py \
            scripts/test-ma-018.py \
            scripts/test-ma-019.py \
            scripts/test-ma-020.py \
            scripts/test-ma-020-finalization.py \
            scripts/test-ma-gate-p01.py \
            scripts/test-ma-gate-p02.py; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done
          python -m unittest discover -s tests -p test_ma_location_origin.py -v
          python -m unittest discover -s tests -p test_ma_instance_identity.py -v
          python -m unittest discover -s tests -p test_ma_frontend_module_registration.py -v
          python -m unittest discover -s tests -p test_ma_v4146_optin_contract.py -v
      - name: Frontend source and MA module regressions
        run: |
          node --check frontend/modules/monitored-areas/index.js
          node tests/test_ma_location_manager.mjs
          node scripts/test-ma-016.mjs
          node scripts/test-ma-020-ui.mjs
          node tests/test_ma_sqlite_preview.mjs
          node scripts/test-gr-panel-cache-recovery.mjs
          node scripts/test-frontend-build.mjs
          node scripts/test-gr-panel-cache-recovery.mjs
          node scripts/verify-current-frontend.mjs

  dev-package:
    needs: sqlite-and-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identical DRA frontend mirrors and SHA256
        run: |
          node scripts/verify-current-frontend.mjs
          sha256sum -c SHA256SUMS_FRONTEND.txt --quiet
          python scripts/verify-deploy-relay-contract.py
          grep -q 'BUILD_VERSION = "4.14.10"' custom_components/gewitterradar/build_info.py
      - name: Package exact verified commit
        run: |
          python scripts/build-dev-packages.py "$RUNNER_TEMP/ma-v41410" --revision "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/ma-v41410" && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: GR-V4.14.10-DEV-verified-${{ github.sha }}
          path: ${{ runner.temp }}/ma-v41410/
          if-no-files-found: error
          retention-days: 30
