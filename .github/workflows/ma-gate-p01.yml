name: MA-GATE-P01 risk-based integration
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths: ['scripts/test-ma-gate-p01.py','.github/workflows/ma-gate-p01.yml','custom_components/gewitterradar/monitored_areas/**']
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          git rev-parse HEAD
          sha256sum scripts/test-ma-gate-p01.py
          python scripts/test-ma-gate-p01.py
  native-off:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          python -m pip install pytest-homeassistant-custom-component==0.13.362
          python -m pip install --no-deps --force-reinstall homeassistant==2026.9.0
          python -m pytest -q tests/test_ma005_off.py tests/test_migration_fresh_install.py
