name: V4.11.03 one-shot frontend sync

on:
  push:
    branches:
      - feature/v4.11-development

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'chore: sync V4.11.03 frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.11-development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build deterministic frontend
        run: node scripts/build-frontend.mjs
      - name: Commit generated delivery parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/gewitterradar/frontend dashboard/dist SHA256SUMS_FRONTEND.txt
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: sync V4.11.03 frontend"
          git push origin HEAD:feature/v4.11-development
