name: V4.11.36 gestures and double tap
on:
  push:
    branches: [feature/v4.11-development, deploy/dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check pinch in/out, drag, double tap and build identity
        run: node scripts/test-v41136-mobile-map.mjs
