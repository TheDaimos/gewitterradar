name: Finalize V4.07.56 promotion

on:
  push:
    branches:
      - finalize/v4.07.56-main-promotion
    paths:
      - 'docs/archive-triggers/V4_07_56_FINALIZE.trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install permanent V4.07.56 release framework
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/v40756-finalization.tar.gz
          echo '97f3dd13c40c0f246831a3c655a60619a08c1e87ab868e77966a6d919f143853  /tmp/v40756-finalization.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v40756-finalization.tar.gz -C .
      - name: Retire superseded runtime close only after preserved legacy copy exists
        shell: bash
        run: |
          set -euo pipefail
          test -s artwork/about-controls/legacy/v4.06/gewitterradar-about-close-premium.webp
          test -s artwork/about-controls/closing.png
          test -s artwork/help-icons/hires/help-close.svg
          rm -f frontend/assets/gewitterradar-about-close-premium.webp
          rm -f custom_components/gewitterradar/frontend/assets/gewitterradar-about-close-premium.webp
          rm -f dashboard/dist/assets/gewitterradar-about-close-premium.webp
      - name: Finalize documentation and canonical deliveries
        run: |
          node scripts/finalize-v40756-docs.mjs
          node scripts/build-frontend.mjs
      - name: Verify protected V4.07.56 state
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/gewitterradar.js
          node scripts/verify-frontend.mjs
          node scripts/test-frontend-build.mjs
          node scripts/test-about-locales.mjs
          node scripts/test-recorder-locales.mjs
          node scripts/verify-diagnostic-contract.mjs
          node scripts/verify-v40756-release.mjs
          node scripts/verify-source-archive-contract.mjs
          python scripts/verify-hacs-integration-package.py
          python -m json.tool custom_components/gewitterradar/manifest.json >/dev/null
      - name: Remove one-shot finalizer and commit exact finalized state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-v40756-promotion.yml docs/archive-triggers/V4_07_56_FINALIZE.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Finalize accepted V4.07.56 for main promotion'
          git push origin HEAD:finalize/v4.07.56-main-promotion
