name: GR V4.12 Aura and Legend Hub regression
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  aura:
    if: github.repository == 'TheDaimos/gewitterradar'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify presentation-only scope before reusing pinned browser evidence
        id: ui_scope
        env:
          GR_PREMIUM_PROOF: ${{ runner.temp }}/premium-evidence/source-proof.json
          GR_POLISH_PROOF: ${{ runner.temp }}/polish-evidence/source-proof.json
          GR_SWATCH_PROOF: ${{ runner.temp }}/swatch-evidence/source-proof.json
          GR_GLASS_PROOF: ${{ runner.temp }}/glass-evidence/source-proof.json
        run: |
          if node -e "process.exit(require('node:fs').readFileSync('frontend/version.js','utf8').includes('version:\"4.12.10\"')?0:1)"; then
            node scripts/test-v412-premium-scope.mjs
            echo "focused=true" >> "$GITHUB_OUTPUT"
          elif node -e "process.exit(require('node:fs').readFileSync('frontend/version.js','utf8').includes('version:\"4.12.11\"')?0:1)"; then
            node scripts/test-v412-polish-scope.mjs
            echo "focused=true" >> "$GITHUB_OUTPUT"
            echo "polish=true" >> "$GITHUB_OUTPUT"
          elif node -e "process.exit(require('node:fs').readFileSync('frontend/version.js','utf8').includes('version:\"4.12.12\"')?0:1)"; then
            node scripts/test-v412-swatch-scope.mjs
            echo "focused=true" >> "$GITHUB_OUTPUT"
            echo "swatch=true" >> "$GITHUB_OUTPUT"
          elif node -e "process.exit(require('node:fs').readFileSync('frontend/version.js','utf8').includes('version:\"4.12.13\"')?0:1)"; then
            node scripts/test-v412-glass-scope.mjs
            node scripts/test-v412-glass-model.mjs
            echo "focused=true" >> "$GITHUB_OUTPUT"
            echo "glass=true" >> "$GITHUB_OUTPUT"
          else
            echo "focused=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Model, schema, source isolation and delivery
        run: |
          pip install PyYAML
          node scripts/test-v412-aura-model.mjs
          node scripts/test-v412-legend-model.mjs
          node scripts/test-v412-sources-model.mjs
          node scripts/test-v412-legend-isolation.mjs
          node scripts/test-eye-hub-model.mjs
          node scripts/test-eye-wow-model.mjs
          python scripts/test-v412-vault-schema.py
          node --test tests/wl02-coverage-contract.test.mjs tests/gr-wind-fix-01.test.mjs tests/gr-temp-world-01.test.mjs tests/synoptic-dev-v411198.test.mjs tests/gr-menu-architecture.test.mjs
          node scripts/test-v411-identity.mjs
          node scripts/test-frontend-build.mjs
          python scripts/check-static.py
      - name: Browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/aura" --no-audit --no-fund playwright@1.56.1 leaflet@1.9.4
          "$RUNNER_TEMP/aura/node_modules/.bin/playwright" install --with-deps chromium
      - name: Aura, edges, recovery, profiles and neon pixels
        if: steps.ui_scope.outputs.focused != 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/aura/node_modules
          GR_AURA_EVIDENCE: ${{ runner.temp }}/aura-evidence
          GR_LEGEND_EVIDENCE: ${{ runner.temp }}/legend-evidence
          GR_MINIMAL_EVIDENCE: ${{ runner.temp }}/minimal-evidence
          GR_SOURCES_EVIDENCE: ${{ runner.temp }}/source-evidence
        run: |
          node scripts/test-v412-aura-browser.cjs
          node scripts/test-v412-legend-browser.cjs
          node scripts/test-v412-minimal-browser.cjs
          node scripts/test-v412-sources-browser.cjs
          node scripts/test-v412-placement-browser.cjs
          node scripts/test-eye-edge-browser.cjs
          node scripts/test-delayed-eye-recovery-browser.cjs
          node scripts/test-settings-vault-browser.cjs
          node scripts/test-eye-wow-browser.cjs
      - name: Focused premium dialog, units and source information acceptance
        if: steps.ui_scope.outputs.focused == 'true' && steps.ui_scope.outputs.polish != 'true' && steps.ui_scope.outputs.swatch != 'true' && steps.ui_scope.outputs.glass != 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/aura/node_modules
          GR_PREMIUM_EVIDENCE: ${{ runner.temp }}/premium-evidence
        run: node scripts/test-v412-premium-browser.cjs
      - name: Focused icon centers, compact settings and live previews
        if: steps.ui_scope.outputs.polish == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/aura/node_modules
          GR_POLISH_EVIDENCE: ${{ runner.temp }}/polish-evidence
        run: node scripts/test-v412-polish-browser.cjs
      - name: Focused material and color choices, compact Synoptic menu and Aura frame
        if: steps.ui_scope.outputs.swatch == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/aura/node_modules
          GR_SWATCH_EVIDENCE: ${{ runner.temp }}/swatch-evidence
        run: node scripts/test-v412-swatch-browser.cjs
      - name: Stable overlapping instruments, Compact Glass, gestures and real Vault profiles
        if: steps.ui_scope.outputs.glass == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/aura/node_modules
          GR_GLASS_EVIDENCE: ${{ runner.temp }}/glass-evidence
        run: node scripts/test-v412-glass-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v412-aura-synthetic-browser-evidence
          path: |
            ${{ runner.temp }}/aura-evidence
            ${{ runner.temp }}/legend-evidence
            ${{ runner.temp }}/minimal-evidence
            ${{ runner.temp }}/source-evidence
            ${{ runner.temp }}/premium-evidence
            ${{ runner.temp }}/polish-evidence
            ${{ runner.temp }}/swatch-evidence
            ${{ runner.temp }}/glass-evidence
          if-no-files-found: ignore
