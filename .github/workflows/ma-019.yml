name: MA-019 controlled Local To-do import contracts
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths:
      - 'custom_components/gewitterradar/monitored_areas/api.py'
      - 'scripts/test-ma-019.py'
      - '.github/workflows/ma-019.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Import atomicity, source freshness and prior contracts
        run: |
          git rev-parse HEAD
          python -m compileall -q custom_components/gewitterradar/monitored_areas
          python scripts/test-ma-019.py
          python scripts/test-ma-018.py
          python scripts/test-ma-016.py
          python scripts/test-ma-gate-p02.py
          python scripts/test-ma-015.py
