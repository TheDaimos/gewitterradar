name: Publish Gewitterradar V4.09

on:
  push:
    branches:
      - main
    paths:
      - 'docs/archive-triggers/V4_09_PUBLISH.trigger'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact V4.09 release identity
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$sha"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' --force
          test "$(git rev-parse refs/remotes/origin/main^{commit})" = "$sha"
          test -f docs/archive-triggers/V4_09_PUBLISH.trigger
          grep -Fx 'VERSION=V4.09' docs/archive-triggers/V4_09_PUBLISH.trigger
          grep -Fx 'NATIVE_INTEGRATION=0.21.0' docs/archive-triggers/V4_09_PUBLISH.trigger
          grep -Fx 'FRONTEND_SHA256=c9f01617d3a19519ecc44f84a7bf71aa3056dee57245af860becd893c652fce2' docs/archive-triggers/V4_09_PUBLISH.trigger
          grep -Fx 'FRONTEND_SIZE=2238824' docs/archive-triggers/V4_09_PUBLISH.trigger
          grep -Fx 'LOCALE_SHA256=dc6506291dd4cfe75e3b9c829fb42f21062511fb574d335af438e6c42711802e' docs/archive-triggers/V4_09_PUBLISH.trigger
          test "$(python -c "import json; print(json.load(open('custom_components/gewitterradar/manifest.json'))['version'])")" = '0.21.0'
          test "$(sha256sum frontend/gewitterradar.js | awk '{print $1}')" = 'c9f01617d3a19519ecc44f84a7bf71aa3056dee57245af860becd893c652fce2'
          test "$(wc -c < frontend/gewitterradar.js | tr -d ' ')" = '2238824'
          test "$(sha256sum frontend/locales/about-locales.js | awk '{print $1}')" = 'dc6506291dd4cfe75e3b9c829fb42f21062511fb574d335af438e6c42711802e'

      - name: Run release contracts on exact main commit
        run: |
          set -euo pipefail
          node scripts/verify-frontend.mjs
          node scripts/verify-diagnostic-contract.mjs
          node scripts/verify-hires-asset-retention.mjs
          node scripts/verify-source-archive-contract.mjs
          bash -n scripts/create-source-archive.sh
          python scripts/verify-hacs-integration-package.py
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/gewitterradar/manifest.json >/dev/null
          node --check frontend/gewitterradar.js
          node --check frontend/locales/about-locales.js

      - name: Wait for all post-merge release gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          required=(
            'Validate Gewitterradar integration'
            'Validate shared Gewitterradar frontend'
            'Diagnostic contract'
            'Hi-Res asset retention'
          )
          for attempt in $(seq 1 120); do
            data=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100")
            waiting=0
            for name in "${required[@]}"; do
              row=$(printf '%s' "$data" | jq -r --arg name "$name" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')
              echo "$name -> $row"
              case "$row" in
                completed:success) ;;
                completed:*) echo "Release gate failed: $name ($row)" >&2; exit 1 ;;
                *) waiting=1 ;;
              esac
            done
            if [ "$waiting" -eq 0 ]; then
              echo 'All required post-merge gates are green.'
              exit 0
            fi
            sleep 15
          done
          echo 'Timed out waiting for post-merge release gates.' >&2
          exit 1

      - name: Create Golden Master from exact V4.09 release commit
        id: golden
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/source-archives
          mkdir -p dist/source-archives
          chmod +x scripts/create-source-archive.sh
          scripts/create-source-archive.sh GOLDEN_MASTER "$GITHUB_SHA" V4.09 dist/source-archives

      - name: Verify Golden Master archive
        shell: bash
        run: |
          set -euo pipefail
          test -s '${{ steps.golden.outputs.zip_path }}'
          test -s '${{ steps.golden.outputs.bundle_path }}'
          test -s '${{ steps.golden.outputs.checksum_path }}'
          (cd dist/source-archives && sha256sum -c "$(basename '${{ steps.golden.outputs.checksum_path }}')")
          unzip -tq '${{ steps.golden.outputs.zip_path }}'
          git bundle verify '${{ steps.golden.outputs.bundle_path }}'

      - name: Upload immutable Golden Master archive
        uses: actions/upload-artifact@v4
        with:
          name: Gewitterradar_V4.09_GOLDEN_MASTER
          path: dist/source-archives/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Freeze exact release commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          git fetch origin '+refs/heads/frozen/v4.09:refs/remotes/origin/frozen/v4.09' 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/frozen/v4.09; then
            test "$(git rev-parse refs/remotes/origin/frozen/v4.09^{commit})" = "$sha"
          else
            git push origin "$sha:refs/heads/frozen/v4.09"
          fi

      - name: Publish GitHub and HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin refs/tags/v4.09 >/dev/null 2>&1; then
            git fetch origin refs/tags/v4.09:refs/tags/v4.09 --force
            test "$(git rev-list -n1 v4.09)" = "$sha"
          fi
          if gh release view v4.09 >/dev/null 2>&1; then
            git fetch origin refs/tags/v4.09:refs/tags/v4.09 --force
            test "$(git rev-list -n1 v4.09)" = "$sha"
            echo 'v4.09 is already published on the exact expected commit.'
          else
            gh release create v4.09 \
              --target "$sha" \
              --title 'Gewitterradar V4.09' \
              --notes-file docs/RELEASE_NOTES_V4_09.md \
              --latest
          fi

      - name: Verify published release points to exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin refs/tags/v4.09:refs/tags/v4.09 --force
          test "$(git rev-list -n1 v4.09)" = "$GITHUB_SHA"
          gh release view v4.09 --json tagName,isDraft,isPrerelease,url,targetCommitish
