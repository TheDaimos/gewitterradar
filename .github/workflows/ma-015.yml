name: MA-015 authenticated API and native Vault ownership
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths:
      - 'custom_components/gewitterradar/monitored_areas/**'
      - 'custom_components/gewitterradar/settings_vault.py'
      - 'custom_components/gewitterradar/__init__.py'
      - 'scripts/test-ma-015.py'
      - 'tests/test_settings_vault.py'
      - '.github/workflows/ma-015.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          git rev-parse HEAD
          python -m compileall -q custom_components/gewitterradar/monitored_areas custom_components/gewitterradar/settings_vault.py
          python scripts/test-ma-015.py
          python scripts/test-ma-014.py
          python scripts/test-ma-013.py
          python scripts/test-ma-012.py
          python scripts/test-ma-011.py
  vault-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          python -m pip install pytest-homeassistant-custom-component==0.13.362
          python -m pip install --no-deps --force-reinstall homeassistant==2026.9.0
          python -m pytest -q tests/test_settings_vault.py -k 'ma013_read_only_owner_verification'
          python -m pytest -q tests/test_ma005_off.py
