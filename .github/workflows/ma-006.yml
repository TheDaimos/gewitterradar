name: MA-006 targeted SQLite lifecycle
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths: ['custom_components/gewitterradar/monitored_areas/**','scripts/test-ma-006.py','scripts/test-ma-003.py','.github/workflows/ma-006.yml']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: |
          git rev-parse HEAD
          python -m compileall -q custom_components/gewitterradar/monitored_areas
          python scripts/test-ma-006.py
      - run: |
          python -m pip install pytest-homeassistant-custom-component==0.13.362
          python -m pip install --no-deps --force-reinstall homeassistant==2026.9.0
          python -m pytest -q tests/test_ma005_off.py tests/test_migration_fresh_install.py
