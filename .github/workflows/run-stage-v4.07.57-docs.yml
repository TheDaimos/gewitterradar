name: Run Gewitterradar V4.07.57 documentation staging

on:
  push:
    branches:
      - release/v4.07.57
    paths:
      - '.github/workflows/run-stage-v4.07.57-docs.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release documentation
        run: python scripts/stage-v40757-docs.py
      - name: Verify visible release anchors
        run: |
          set -euo pipefail
          grep -F 'Gewitterradar-V4.07.57' README.md
          grep -F 'Integration-0.19.1' README.md
          grep -F 'type: vertical-stack' README.md
          grep -F 'number.gewitterradar_observation_radius' README.md
          grep -F '# Gewitterradar V4.07.57 – Installation' docs/INSTALLATION.md
          grep -F 'ac921b5fc40f2d7f36733bb7262fdb1595790674695ad0eb83ccde8bc7146571' README.md docs/INSTALLATION.md docs/RELEASE_NOTES_V4_07_57.md PROJECT_DEFAULTS.md docs/V4_07_RELEASE_TODO.md
      - name: Commit release documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/INSTALLATION.md CHANGELOG.md PROJECT_DEFAULTS.md docs/MILESTONES.md docs/HISTORY.md docs/V4_07_RELEASE_TODO.md docs/RELEASE_NOTES_V4_07_57.md docs/archive-triggers/V4_07_57_PUBLISH.trigger
          git commit -m 'docs: finalize V4.07.57 public release documentation'
          git push origin HEAD:release/v4.07.57
