name: Bootstrap V4.07.56 binary import

on:
  push:
    branches:
      - finalize/v4.07.56-main-promotion
    paths:
      - 'docs/archive-triggers/V4_07_56_IMPORT.trigger'

permissions:
  contents: write

jobs:
  import-accepted-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify exact accepted V4.07.56 package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/user-attachments/files/32284880/Gewitterradar_V4.07.56_DIAGNOSE_MULTICELL_EXTREME_COMPLETE.1.zip' \
            --output /tmp/v40756.zip
          echo 'c810e38ce59d3e7dbd3c04534f47cc428714aff19dc5fb619466001450e0e695  /tmp/v40756.zip' | sha256sum -c -
          mkdir -p /tmp/v40756
          unzip -q /tmp/v40756.zip -d /tmp/v40756
          (cd /tmp/v40756 && sha256sum -c SHA256SUMS.txt)
      - name: Import accepted canonical frontend and locale module byte-identically
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 /tmp/v40756/gewitterradar.js frontend/gewitterradar.js
          install -m 0644 /tmp/v40756/gewitterradar.js custom_components/gewitterradar/frontend/gewitterradar.js
          install -m 0644 /tmp/v40756/gewitterradar.js dashboard/dist/gewitterradar.js
          install -m 0644 /tmp/v40756/locales/about-locales.js frontend/locales/about-locales.js
          install -m 0644 /tmp/v40756/locales/about-locales.js custom_components/gewitterradar/frontend/locales/about-locales.js
          install -m 0644 /tmp/v40756/locales/about-locales.js dashboard/dist/locales/about-locales.js
          echo '249485f4bcf68c9b23b821cae9b507030ae09cff5a56f7e28d3d7f3b02eb4a1a  frontend/gewitterradar.js' | sha256sum -c -
          echo '997c4fe9b357935888fdb7bedc43cdd17f105b97241a000324891cea575dd436  frontend/locales/about-locales.js' | sha256sum -c -
      - name: Import all world-location Hi-Res masters and derived artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artwork/location-search/hires artwork/location-search/runtime
          cp -a /tmp/v40756/artwork/location-search/hires/. artwork/location-search/hires/
          cp -a /tmp/v40756/artwork/location-search/runtime/. artwork/location-search/runtime/
          cp /tmp/v40756/artwork/location-search/README.md artwork/location-search/README.md
          mkdir -p artwork/location-search/legacy/v4.07.56
          cp /tmp/v40756/artwork/gewitterradar-coordinate-target-master.svg \
             artwork/location-search/legacy/v4.07.56/gewitterradar-coordinate-target-master.svg
          mkdir -p artwork/location-search/package-assets/v4.07.56
          cp -a /tmp/v40756/assets/. artwork/location-search/package-assets/v4.07.56/
      - name: Preserve superseded close runtime in versioned legacy area
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artwork/about-controls/legacy/v4.06
          cp frontend/assets/gewitterradar-about-close-premium.webp \
             artwork/about-controls/legacy/v4.06/gewitterradar-about-close-premium.webp
          test -s artwork/about-controls/closing.png
          test -s artwork/help-icons/hires/help-close.svg
      - name: Remove one-shot bootstrap files and commit imported payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-v40756-final.yml docs/archive-triggers/V4_07_56_IMPORT.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Import accepted V4.07.56 payload and protected artwork'
          git push origin HEAD:finalize/v4.07.56-main-promotion
