name: Finalize Gewitterradar V4.09 from V4.09.28
on:
  push:
    branches:
      - release/v4.09
    paths:
      - '.github/workflows/finalize-v4.09.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalize accepted candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          candidate_sha='0f85dd6866339745c9daabbf7356badf9c49e683a02d16856d86fdc998117fd8'
          candidate_size=2238844
          release_sha='e349c01f55d22ea69d9c066df00b53c7910ec57e8234a8a423f8d680e6e30e7d'
          release_size=2238838
          old_sha='44fb540e33e3d2428cd1c8b53cc9a256179831cb69eef877cd17997b7b58c048'
          def h(b): return hashlib.sha256(b).hexdigest()
          p=Path('frontend/gewitterradar.js')
          raw=p.read_bytes()
          if len(raw)!=candidate_size or h(raw)!=candidate_sha:
              raise SystemExit('V4.09.28 candidate identity mismatch')
          s=raw.decode('utf-8')
          pairs=[
            ('Gewitterradar Card V4.09.28 DEV','Gewitterradar Card V4.09 FINAL'),
            ("const CARD_VERSION = '4.09.28';","const CARD_VERSION = '4.09';"),
            ("const CARD_DISPLAY_VERSION = '4.09.28';","const CARD_DISPLAY_VERSION = '4.09';"),
            ("const GEWITTERRADAR_BUILD = 'V4.09.28-DEV-2026-09-21';","const GEWITTERRADAR_BUILD = 'V4.09-RELEASE-2026-09-21';"),
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit('missing normalization marker: '+old)
              s=s.replace(old,new,1)
          final=s.encode('utf-8')
          if len(final)!=release_size or h(final)!=release_sha:
              raise SystemExit('V4.09 final identity mismatch')
          for f in ['frontend/gewitterradar.js','custom_components/gewitterradar/frontend/gewitterradar.js','dashboard/dist/gewitterradar.js']:
              Path(f).write_bytes(final)

          p=Path('tests/contracts/frontend-release-v4.09.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['sha256']=release_sha
          d['sizeBytes']=release_size
          d['acceptedCandidateVersion']='4.09.28'
          d['acceptedCandidateSha256']=candidate_sha
          d['acceptedCandidateSizeBytes']=candidate_size
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          p=Path('scripts/build-frontend.mjs')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ("const acceptedCandidateFrontendSha='228a7e81ddf035b3cc2bf6d1856621c595cb85bb4f79e5e0626a9ae943ec3fb2';","const acceptedCandidateFrontendSha='"+candidate_sha+"';"),
            ('const acceptedCandidateFrontendSize=2234782;','const acceptedCandidateFrontendSize='+str(candidate_size)+';'),
            ('V4.09.26 DEV','V4.09.28 DEV'),
            ("CARD_VERSION = '4.09.26'","CARD_VERSION = '4.09.28'"),
            ("CARD_DISPLAY_VERSION = '4.09.26'","CARD_DISPLAY_VERSION = '4.09.28'"),
            ('V4.09.26-DEV-2026-09-21','V4.09.28-DEV-2026-09-21'),
            ("acceptedCandidateVersion!=='4.09.26'","acceptedCandidateVersion!=='4.09.28'"),
            ('Accepted V4.09.26 provenance changed','Accepted V4.09.28 provenance changed'),
            ('accepted V4.09.26','accepted V4.09.28'),
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit('missing builder marker: '+old)
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('SHA256SUMS_FRONTEND.txt')
          s=p.read_text(encoding='utf-8')
          if s.count(old_sha)!=2: raise SystemExit('unexpected frontend checksum count')
          p.write_text(s.replace(old_sha,release_sha),encoding='utf-8')

          p=Path('docs/archive-triggers/V4_09_PUBLISH.trigger')
          s=p.read_text(encoding='utf-8').replace(old_sha,release_sha).replace('FRONTEND_SIZE=2234776','FRONTEND_SIZE='+str(release_size))
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/publish-v4.09.yml')
          s=p.read_text(encoding='utf-8')
          if s.count(old_sha)<2: raise SystemExit('publisher SHA markers missing')
          s=s.replace(old_sha,release_sha).replace('2234776',str(release_size))
          p.write_text(s,encoding='utf-8')

          z=Path('Gewitterradar_V4.09.27_TEST_COORD_CLEAR_DROPDOWN.zip')
          if z.exists(): z.unlink()
          PY
      - name: Verify final release contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-frontend.mjs
          node scripts/verify-frontend.mjs
          node scripts/verify-diagnostic-contract.mjs
          node scripts/verify-hires-asset-retention.mjs
          node scripts/verify-source-archive-contract.mjs
          python scripts/verify-hacs-integration-package.py
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/gewitterradar/manifest.json >/dev/null
          node --check frontend/gewitterradar.js
          node --check frontend/locales/about-locales.js
      - name: Commit normalized V4.09
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: finalize V4.09 from accepted V4.09.28'
          git push origin HEAD:release/v4.09
