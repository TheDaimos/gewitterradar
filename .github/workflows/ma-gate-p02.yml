name: MA-GATE-P02 T2 authorized API and SQLite integration
on:
  push:
    branches: [feature/v4.14-monitored-areas]
    paths:
      - 'scripts/test-ma-gate-p02.py'
      - 'scripts/test-ma-015.py'
      - 'custom_components/gewitterradar/monitored_areas/**'
      - 'custom_components/gewitterradar/settings_vault.py'
      - 'tests/test_ma015_native_ws.py'
      - '.github/workflows/ma-gate-p02.yml'
permissions:
  contents: read
jobs:
  t2-storage-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: P02 T2 security integration + source digest
        run: |
          git rev-parse HEAD
          sha256sum scripts/test-ma-gate-p02.py
          python -m compileall -q custom_components/gewitterradar/monitored_areas
          python scripts/test-ma-gate-p02.py
          python scripts/test-ma-015.py
  t2-native-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install HA native fixtures
        run: |
          python -m pip install pytest-homeassistant-custom-component==0.13.362
          python -m pip install --no-deps --force-reinstall homeassistant==2026.9.0
      - name: Native authenticated actor and OFF contracts
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/test_settings_vault.py -k ma013_read_only_owner_verification
          python -m pytest -q tests/test_ma015_native_ws.py
          python -m pytest -q tests/test_ma005_off.py
