name: TEST70-47 WR stale warning public release
on:
  push:
    branches: [deploy/dev]
    paths:
      - 'scripts/test70-47-release-ci.py'
      - '.github/workflows/test70-47-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test70-47
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stale status is WR authoritative
        run: |
          grep -q 'response.preview_age_status==="stale"' frontend/modules/weather/p7-010/opera-diagnostic-tile.js
          grep -q 'OPERA Daten veraltet' frontend/modules/weather/p7-010/opera-diagnostic-tile.js
          cmp frontend/modules/weather/p7-010/opera-diagnostic-tile.js custom_components/gewitterradar/frontend/modules/weather/p7-010/opera-diagnostic-tile.js
          cmp frontend/modules/weather/p7-010/opera-diagnostic-tile.js dashboard/dist/modules/weather/p7-010/opera-diagnostic-tile.js
      - name: Build and regression
        run: python scripts/test70-47-release-ci.py
      - name: Syntax and whitespace
        run: |
          node --check frontend/modules/weather/p7-010/opera-diagnostic-tile.js
          git diff --check
      - name: Commit tested release to public DEV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet && exit 1
          git commit -m "release(test70-47): GR 4.11.127 WR-driven stale legend badge"
          git push origin HEAD:deploy/dev
