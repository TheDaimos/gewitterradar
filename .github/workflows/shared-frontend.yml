name: Validate shared Gewitterradar frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shared-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: One-shot V4.11.05 identity and delivery sync
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: run V4.11.05 identity sync v2' }}"
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          frontend = Path("frontend")
          changed = 0
          for path in frontend.rglob("*.js"):
              text = path.read_text(encoding="utf-8")
              next_text = text.replace("41104r1", "41105r1")
              if path == frontend / "version.js":
                  next_text = (next_text
                      .replace('version:"4.11.04"', 'version:"4.11.05"')
                      .replace('displayVersion:"V4.11.04 DEV"', 'displayVersion:"V4.11.05 DEV"')
                      .replace('build:"V4.11.04-DEV-2026-09-30"', 'build:"V4.11.05-DEV-2026-10-01"')
                      .replace('moduleSetId:"E411-04A1"', 'moduleSetId:"E411-05A1"')
                      .replace('integrationVersion:"0.23.3"', 'integrationVersion:"0.23.4"'))
              if path == frontend / "module-manifest.js":
                  next_text = (next_text
                      .replace('"id": "core.manifest",\n    "version": "1.2.50"', '"id": "core.manifest",\n    "version": "1.2.51"')
                      .replace('"id": "weather.precipitation-layer",\n    "version": "1.1.0"', '"id": "weather.precipitation-layer",\n    "version": "1.2.0"')
                      .replace('id:"core.manifest",version:"1.2.50"', 'id:"core.manifest",version:"1.2.51"'))
              if path == frontend / "gewitterradar.js":
                  next_text = next_text.replace("Gewitterradar Card V4.11.04 DEV", "Gewitterradar Card V4.11.05 DEV")
              if next_text != text:
                  path.write_text(next_text, encoding="utf-8")
                  changed += 1

          runtime_path = frontend / "assets/gewitterradar-runtime-manifest.json"
          runtime = json.loads(runtime_path.read_text(encoding="utf-8"))
          runtime["productVersion"] = "4.11.05"
          runtime["displayVersion"] = "V4.11.05 DEV"
          runtime["build"] = "V4.11.05-DEV-2026-10-01"
          runtime["runtimeRevision"] = "41105r1"
          runtime["moduleSetId"] = "E411-05A1"
          for module in runtime["modules"]:
              if module["id"] == "core.manifest":
                  module["version"] = "1.2.51"
              elif module["id"] == "weather.precipitation-layer":
                  module["version"] = "1.2.0"
          runtime_path.write_text(json.dumps(runtime, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          assets_path = frontend / "assets.json"
          assets = json.loads(assets_path.read_text(encoding="utf-8"))
          item = next(x for x in assets if x["file"] == "assets/gewitterradar-runtime-manifest.json")
          item["sha256"] = hashlib.sha256(runtime_path.read_bytes()).hexdigest()
          assets_path.write_text(json.dumps(assets, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          build_info = Path("custom_components/gewitterradar/build_info.py")
          build_info.write_text(build_info.read_text(encoding="utf-8").replace('BUILD_VERSION = "4.11.04"', 'BUILD_VERSION = "4.11.05"'), encoding="utf-8")

          manifest_path = Path("custom_components/gewitterradar/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = "0.23.4"
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          provenance_path = Path("custom_components/gewitterradar/dra-deployment-provenance.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          provenance["productVersion"] = "4.11.05"
          provenance["build"] = "V4.11.05-DEV-2026-10-01"
          provenance["runtimeRevision"] = "41105r1"
          provenance["moduleSetId"] = "E411-05A1"
          provenance["deployment"]["purpose"] = "V4.11.05 DEV: provider-neutral precipitation-radar timeline player with past/current/forecast controls and double-buffered frame switching; existing deploy/dev channel only"
          for key in ("publishedAt","publicationSourceCommit","publicationRevision"):
              provenance["deployment"].pop(key, None)
          provenance_path.write_text(json.dumps(provenance, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          print("Updated frontend JS files:", changed)
          PY
          node scripts/build-frontend.mjs

      - name: Print frontend contract hashes
        run: |
          sha256sum frontend/gewitterradar.js
          wc -c frontend/gewitterradar.js
          sha256sum frontend/module-manifest.js
          wc -c frontend/module-manifest.js
          sha256sum frontend/modules/diagnostics/cockpit.js
          wc -c frontend/modules/diagnostics/cockpit.js
          sha256sum frontend/modules/instruments/medallion-designs.js
          wc -c frontend/modules/instruments/medallion-designs.js
          sha256sum frontend/modules/fullscreen/map-display.js
          wc -c frontend/modules/fullscreen/map-display.js
          sha256sum frontend/assets/gewitterradar-runtime-manifest.json
          wc -c frontend/assets/gewitterradar-runtime-manifest.json

      - name: V4.11 WeatherRouter Consumer V1 contract
        run: node scripts/test-v411-weather-router.mjs

      - name: V4.11 canonical DEV identity
        run: node scripts/test-v411-identity.mjs

      - name: V4.11.05 precipitation radar timeline player
        run: node scripts/test-v41105-weather-radar-player.mjs

      - name: Canonical frontend contract
        run: node scripts/verify-frontend.mjs

      - name: Emit regenerated checksum inventory on failure
        if: failure()
        run: |
          node scripts/build-frontend.mjs
          echo '---SHA256SUMS_FRONTEND_BEGIN---'
          cat SHA256SUMS_FRONTEND.txt
          echo '---SHA256SUMS_FRONTEND_END---'

      - name: Deterministic frontend build
        run: node scripts/test-frontend-build.mjs

      - name: Frontend JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "syntax: $file"
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0 | sort -z)

      - name: About and Help locale contract
        run: node scripts/test-about-locales.mjs

      - name: Recorder locale release audit
        run: node scripts/test-recorder-locales.mjs

      - name: Protected diagnostic contract
        run: node scripts/verify-diagnostic-contract.mjs

      # Historical V4.06/V4.07 regression scripts remain as protected evidence.
      # V4.07.57 is validated as a version/build-metadata-only patch over the
      # exact accepted V4.07.56 runtime, diagnostic and geometry baseline.

      - run: npm install --no-save --package-lock=false playwright@1.62.1 sharp@0.34.5

      - name: Generate medallion/arrow fit matrix evidence
        run: node scripts/generate-medallion-arrow-fit-matrix.cjs

      - run: npx playwright install --with-deps chromium

      - name: About locale registry and rendering
        run: node scripts/test-about-locales.mjs "$(node -p "require('playwright').chromium.executablePath()")"

      - name: Language onboarding
        run: node scripts/test-language-onboarding.cjs "$(node -p "require('playwright').chromium.executablePath()")"

      - name: V4.08 Settings and Help profiles
        run: node scripts/test-v40756-settings-help.cjs "$(node -p "require('playwright').chromium.executablePath()")"

      - name: Medallion asset contract
        run: node scripts/test-medallion-assets.cjs

      - name: Instrument picker diagnostics
        run: node scripts/test-picker-diagnostics.cjs "$(node -p "require('playwright').chromium.executablePath()")"

      - name: V4.08 About geometry against protected V4.07.56 golden contract
        run: node scripts/verify-about-golden-v408.cjs "$(node -p "require('playwright').chromium.executablePath()")"

      - name: Both delivery browser suites
        run: |
          set -euo pipefail
          chrome=$(node -p "require('playwright').chromium.executablePath()")
          for delivery in dashboard integration; do
            mkdir -p "artwork/acceptance/premium-controls/$delivery"
            ABOUT_DELIVERY="$delivery" node scripts/test-about-browser-v40756.cjs "$chrome" "artwork/acceptance/premium-controls/$delivery"
          done

      - name: Commit one-shot V4.11.05 sync
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: run V4.11.05 identity sync v2' }}"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend custom_components/gewitterradar dashboard/dist SHA256SUMS_FRONTEND.txt
          git commit -m "chore: sync V4.11.05 frontend"
          git push origin HEAD:feature/v4.11-development

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-frontend-browser-evidence
          path: |
            artwork/acceptance/premium-controls/
            artwork/acceptance/medallion-arrow-fit/
            frontend/assets/gewitterradar-trend-medallion.png
            frontend/assets/gewitterradar-trend-medallion-*.webp
            frontend/assets/gewitterradar-trend-arrow.png
            frontend/assets/gewitterradar-trend-arrow-*.webp
          if-no-files-found: warn

