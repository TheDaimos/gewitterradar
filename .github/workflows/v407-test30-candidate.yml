name: Build V4.07.30 Help Use token candidate

on:
  push:
    branches:
      - feature/v4.07-location-search-ui-next
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test30:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check TEST29/TEST30 scripts and locale module
        run: |
          node --check frontend/locales/about-locales.js
          node --check scripts/v4-07-test29-external-help-locales-delta.mjs
          node --check scripts/v4-07-test29-build-external-help-locales.mjs
          node --check scripts/finalize-v407-test29-candidate.mjs
          node --check scripts/test-v407-test29-candidate.mjs
          node --check scripts/v4-07-test30-help-use-token-delta.mjs
          node --check scripts/finalize-v407-test30-candidate.mjs
          node --check scripts/test-v407-test30-candidate.mjs
      - name: Rebuild V4.07 candidate chain through TEST14
        run: |
          node scripts/build-v407-location-search-candidate.mjs
          node scripts/finalize-v407-test8-candidate.mjs
          node scripts/finalize-v407-test9-candidate.mjs
          node scripts/finalize-v407-test10-candidate.mjs
          node scripts/finalize-v407-test10r1-candidate.mjs
          node scripts/finalize-v407-test11-candidate.mjs
          node scripts/finalize-v407-test12-candidate.mjs
          node scripts/finalize-v407-test13-candidate.mjs
          node scripts/finalize-v407-test14-candidate.mjs
      - name: Rebuild exact TEST15 through TEST19 baselines
        run: |
          node scripts/finalize-v407-test15-candidate.mjs
          node scripts/test-v407-test15-candidate.mjs
          node scripts/finalize-v407-test16-candidate.mjs
          node scripts/test-v407-test16-candidate.mjs
          node scripts/finalize-v407-test17-candidate.mjs
          node scripts/test-v407-test17-candidate.mjs
          node scripts/finalize-v407-test18-candidate.mjs
          node scripts/test-v407-test18-candidate.mjs
          node scripts/finalize-v407-test19-candidate.mjs
          node scripts/test-v407-test19-candidate.mjs
          echo "1a1446a11eb5a4574712de0370f6204a4948d173f9f67c1110d28ded79b3a152  artifacts/v407/gewitterradar-v4.07.19.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar-v4.07.19.js)" -eq 1845550
      - name: Rebuild exact TEST20 through TEST24 baselines
        run: |
          node scripts/finalize-v407-test20-candidate.mjs
          node scripts/test-v407-test20-candidate.mjs
          echo "ba3d45b6362c40572a9e8da97182a8dddc42fc7baac28a823d6269224e6742ca  artifacts/v407/gewitterradar-v4.07.20.js" | sha256sum -c -
          node scripts/finalize-v407-test21-candidate.mjs
          node scripts/test-v407-test21-candidate.mjs
          echo "241808eb2d9924f3dc737cc4eabce053ebc57883245e1a0bfaf8d1f864b669c7  artifacts/v407/gewitterradar-v4.07.21.js" | sha256sum -c -
          node scripts/finalize-v407-test22-candidate.mjs
          node scripts/test-v407-test22-candidate.mjs
          echo "ec883d20eea8db95b22884b001cdf85c0c20e8cdec39ab3caf9fedb079f795fe  artifacts/v407/gewitterradar-v4.07.22.js" | sha256sum -c -
          node scripts/finalize-v407-test23-candidate.mjs
          node scripts/test-v407-test23-candidate.mjs
          echo "061b79c11e5507c27ec62dc552b9a7ec1e0caccc9a10e3b3d7ccd928113a786e  artifacts/v407/gewitterradar-v4.07.23.js" | sha256sum -c -
          node scripts/finalize-v407-test24-candidate.mjs
          node scripts/test-v407-test24-candidate.mjs
          echo "049bc765796bc323ddd62bd61a4106291ec67648a1df941c2465b6db861dcb01  artifacts/v407/gewitterradar-v4.07.24.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar-v4.07.24.js)" -eq 1855999
      - name: Rebuild exact TEST25 through TEST28 baselines
        run: |
          node scripts/finalize-v407-test25-candidate.mjs
          node --check artifacts/v407/gewitterradar-v4.07.25.js
          node scripts/test-v407-test25-candidate.mjs
          echo "2a41b28790d729103775066ae9cdc00d21fab4e1b456b7caf538a049488c7d52  artifacts/v407/gewitterradar-v4.07.25.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar-v4.07.25.js)" -eq 1856472
          node scripts/finalize-v407-test26-candidate.mjs
          node --check artifacts/v407/gewitterradar-v4.07.26.js
          node scripts/test-v407-test26-candidate.mjs
          echo "885bb0783592bc2500f5524e74f419de95bd58da9d3e86c744f11206b003181b  artifacts/v407/gewitterradar-v4.07.26.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar-v4.07.26.js)" -eq 1856322
          node scripts/finalize-v407-test27-candidate.mjs
          node --check artifacts/v407/gewitterradar-v4.07.27.js
          node scripts/test-v407-test27-candidate.mjs
          echo "5672842a135c00189805079346d0b9fc0f38b13863c019106e6dc66b355c1938  artifacts/v407/gewitterradar-v4.07.27.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar-v4.07.27.js)" -eq 1857668
          node scripts/finalize-v407-test28-candidate.mjs
          node --check artifacts/v407/gewitterradar-v4.07.28.js
          node scripts/test-v407-test28-candidate.mjs
          node scripts/test-v407-full-i18n-candidate.mjs
          node scripts/test-v407-help-runtime-locales.mjs
          echo "d3c67dbcc2a9c25bec71eb6deb0ecd1085b054d61435b366a7c442f4a4d169f8  artifacts/v407/gewitterradar-v4.07.28.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar-v4.07.28.js)" -eq 1858624
      - name: Rebuild exact TEST29 baseline
        run: |
          node scripts/finalize-v407-test29-candidate.mjs
          node --check artifacts/v407/gewitterradar-v4.07.29.js
          node scripts/test-v407-test29-candidate.mjs
          echo "0a65b11e59bae32ec267a3269f0f3c5aceec28adb4b7a8d040fd1d5bec327c93  artifacts/v407/gewitterradar-v4.07.29.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar-v4.07.29.js)" -eq 1777891
          echo "f88f3c00e2f4e888e0354f9bf1cddea7035730d2771e0eac4f3f948271a7f189  artifacts/v407/locales/about-locales.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/locales/about-locales.js)" -eq 402169
      - name: Finalize and test V4.07.30
        run: |
          node scripts/finalize-v407-test30-candidate.mjs
          node --check artifacts/v407/gewitterradar-v4.07.30.js
          node scripts/test-v407-test30-candidate.mjs
          echo "858d2d21026814d916d9358fb11bcb39805fd4f0f6104553dbcf4f7a5c454cb0  artifacts/v407/gewitterradar-v4.07.30.js" | sha256sum -c -
          test "$(wc -c < artifacts/v407/gewitterradar-v4.07.30.js)" -eq 1779464
          echo "f88f3c00e2f4e888e0354f9bf1cddea7035730d2771e0eac4f3f948271a7f189  artifacts/v407/locales/about-locales.js" | sha256sum -c -
          cmp artifacts/v407/gewitterradar.js artifacts/v407/gewitterradar-v4.07-test.js
          cmp artifacts/v407/gewitterradar.js artifacts/v407/gewitterradar-v4.07.30.js
      - name: Publish complete V4.07.30 candidate
        uses: actions/upload-artifact@v4
        with:
          name: v407-test30-complete
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/v407/gewitterradar.js
            artifacts/v407/gewitterradar-v4.07-test.js
            artifacts/v407/gewitterradar-v4.07.29.js
            artifacts/v407/gewitterradar-v4.07.30.js
            artifacts/v407/locales/about-locales.js
            artifacts/v407/SHA256SUMS.txt
